<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Gerenciar produtos | Garimpo Online
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      background: #080808;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }

    .container {

      width: 100%;

      max-width: 900px;

      margin: auto;

      padding: 30px 20px 80px;

    }

    .top {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 30px;

    }

    .top h1 {

      margin: 0;

      font-size: 28px;

    }

    .back {

      color: #ffd600;

      text-decoration: none;

      font-size: 13px;

    }

    .box {

      background: #111;

      border: 1px solid #292929;

      border-radius: 16px;

      padding: 22px;

      margin-bottom: 25px;

    }

    .box h2 {

      margin-top: 0;

      font-size: 18px;

    }

    .grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

    }

    label {

      display: block;

      color: #aaa;

      font-size: 12px;

      margin-bottom: 6px;

    }

    input,
    textarea,
    select {

      width: 100%;

      background: #080808;

      border: 1px solid #333;

      color: #fff;

      border-radius: 9px;

      padding: 12px;

      font-size: 14px;

    }

    textarea {

      min-height: 90px;

      resize: vertical;

    }

    input:focus,
    textarea:focus,
    select:focus {

      outline: none;

      border-color: #ffd600;

    }

    .full {

      grid-column: 1 / -1;

    }

    button {

      border: 0;

      border-radius: 9px;

      padding: 13px 18px;

      background: #ffd600;

      color: #000;

      font-weight: 900;

      cursor: pointer;

      font-size: 13px;

    }

    button:hover {

      background: #ffe44d;

    }

    .secondary {

      background: #222;

      color: #fff;

    }

    .secondary:hover {

      background: #333;

    }

    .danger {

      background: #d93025;

      color: #fff;

    }

    .status {

      margin-top: 15px;

      padding: 12px;

      border-radius: 9px;

      background: #191919;

      color: #aaa;

      font-size: 13px;

      display: none;

    }

    .products {

      display: grid;

      gap: 10px;

    }

    .product {

      border: 1px solid #292929;

      background: #0d0d0d;

      border-radius: 12px;

      padding: 15px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

    }

    .product-info {

      min-width: 0;

    }

    .product-name {

      font-weight: 800;

      margin-bottom: 5px;

    }

    .product-price {

      color: #ffd600;

      font-weight: 900;

    }

    .product-ml {

      color: #777;

      font-size: 11px;

      margin-top: 5px;

    }

    .actions {

      display: flex;

      gap: 7px;

      flex-shrink: 0;

    }

    .empty {

      color: #777;

      text-align: center;

      padding: 25px;

    }

    @media (max-width: 650px) {

      .grid {

        grid-template-columns: 1fr;

      }

      .full {

        grid-column: auto;

      }

      .product {

        align-items: flex-start;

        flex-direction: column;

      }

      .actions {

        width: 100%;

      }

      .actions button {

        flex: 1;

      }

    }

  </style>

</head>


<body>

<div class="container">


  <div class="top">

    <h1>
      Gerenciar produtos
    </h1>

    <a
      class="back"
      href="index.html"
    >
      ← Voltar para o site
    </a>

  </div>


  <div class="box">

    <h2>
      Adicionar produto
    </h2>

    <div class="grid">


      <div>

        <label>
          Nome
        </label>

        <input
          id="name"
          type="text"
          placeholder="Ex.: Fone Bluetooth"
        >

      </div>


      <div>

        <label>
          Categoria
        </label>

        <input
          id="category"
          type="text"
          placeholder="Ex.: Eletrônicos"
        >

      </div>


      <div class="full">

        <label>
          Descrição
        </label>

        <textarea
          id="description"
          placeholder="Descrição do produto"
        ></textarea>

      </div>


      <div>

        <label>
          Preço inicial
        </label>

        <input
          id="price"
          type="number"
          step="0.01"
          placeholder="99.90"
        >

      </div>


      <div>

        <label>
          URL do Mercado Livre
        </label>

        <input
          id="mercadolivre_url"
          type="url"
          placeholder="https://www.mercadolivre.com.br/..."
        >

      </div>


      <div class="full">

        <label>
          Link de afiliado
        </label>

        <input
          id="affiliate_url"
          type="url"
          placeholder="Seu link de afiliado"
        >

      </div>


      <div class="full">

        <label>
          URL da imagem
        </label>

        <input
          id="image_url"
          type="url"
          placeholder="https://..."
        >

      </div>


    </div>


    <br>


    <button
      id="save"
      type="button"
    >
      Adicionar produto
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div class="box">

    <h2>
      Produtos cadastrados
    </h2>

    <div
      id="products"
      class="products"
    ></div>

  </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const status =
  document.getElementById(
    "status"
  );


function showStatus(
  message,
  error = false
) {

  status.style.display =
    "block";

  status.textContent =
    message;

  status.style.color =
    error
      ? "#ff7777"
      : "#aaa";

}


function extractMLB(url) {

  if (!url) {
    return "";
  }


  const text =
    String(url)
      .toUpperCase();


  const match =
    text.match(
      /MLB[-_]?(\d{6,})/
    );


  if (!match) {
    return "";
  }


  return "MLB" + match[1];

}


function clearForm() {

  document.getElementById(
    "name"
  ).value = "";

  document.getElementById(
    "category"
  ).value = "";

  document.getElementById(
    "description"
  ).value = "";

  document.getElementById(
    "price"
  ).value = "";

  document.getElementById(
    "mercadolivre_url"
  ).value = "";

  document.getElementById(
    "affiliate_url"
  ).value = "";

  document.getElementById(
    "image_url"
  ).value = "";

}


async function loadProducts() {

  const result =
    await db
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (result.error) {

    console.error(
      result.error
    );

    document.getElementById(
      "products"
    ).innerHTML = `
      <div class="empty">
        Erro ao carregar produtos.
      </div>
    `;

    return;

  }


  const products =
    result.data || [];


  if (!products.length) {

    document.getElementById(
      "products"
    ).innerHTML = `
      <div class="empty">
        Nenhum produto cadastrado.
      </div>
    `;

    return;

  }


  document.getElementById(
    "products"
  ).innerHTML =

    products
      .map(
        product => {

          const price =
            product.current_price ??
            product.price ??
            "—";


          return `

            <div
              class="product"
            >

              <div
                class="product-info"
              >

                <div
                  class="product-name"
                >
                  ${escapeHtml(
                    product.name ||
                    "Produto"
                  )}
                </div>

                <div
                  class="product-price"
                >
                  R$
                  ${Number(price)
                    .toFixed(2)
                    .replace(".", ",")}
                </div>

                <div
                  class="product-ml"
                >
                  ${
                    product.mercadolivre_id
                      ? product.mercadolivre_id
                      : "Sem ID do Mercado Livre"
                  }
                </div>

              </div>


              <div
                class="actions"
              >

                <button
                  class="secondary"
                  onclick="updatePrice('${product.id}')"
                >
                  Atualizar
                </button>


                <button
                  class="danger"
                  onclick="removeProduct('${product.id}')"
                >
                  Excluir
                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(match) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[match];

      }
    );

}


document
  .getElementById("save")
  .addEventListener(
    "click",
    async function() {


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const category =
        document.getElementById(
          "category"
        ).value.trim();


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      const price =
        document.getElementById(
          "price"
        ).value;


      const mlUrl =
        document.getElementById(
          "mercadolivre_url"
        ).value.trim();


      const affiliateUrl =
        document.getElementById(
          "affiliate_url"
        ).value.trim();


      const imageUrl =
        document.getElementById(
          "image_url"
        ).value.trim();


      if (!name) {

        showStatus(
          "Digite o nome do produto.",
          true
        );

        return;

      }


      const mlId =
        extractMLB(
          mlUrl
        );


      if (!mlId) {

        showStatus(
          "Coloque uma URL válida de anúncio do Mercado Livre contendo MLB + número.",
          true
        );

        return;

      }


      showStatus(
        "Salvando produto..."
      );


      const result =
        await db
          .from("products")
          .insert({

            name:
              name,

            description:
              description,

            price:
              price
                ? Number(price)
                : null,

            current_price:
              price
                ? Number(price)
                : null,

            image_url:
              imageUrl,

            affiliate_url:
              affiliateUrl,

            category:
              category || "Achadinhos",

            active:
              true,

            mercadolivre_id:
              mlId

          });


      if (result.error) {

        console.error(
          result.error
        );

        showStatus(
          "Erro ao salvar: " +
          result.error.message,
          true
        );

        return;

      }


      showStatus(
        "Produto adicionado com sucesso!"
      );


      clearForm();

      loadProducts();

    }
  );


async function updatePrice(id) {

  showStatus(
    "Atualizando preço..."
  );


  const result =
    await fetch(
      SUPABASE_URL +
      "/functions/v1/atualizar-precos",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            product_id:
              id
          })
      }
    );


  const data =
    await result.json();


  if (!result.ok) {

    showStatus(
      data.error ||
      "Erro ao atualizar.",
      true
    );

    return;

  }


  showStatus(
    "Preço atualizado!"
  );


  loadProducts();

}


async function removeProduct(id) {

  if (
    !confirm(
      "Excluir este produto?"
    )
  ) {
    return;
  }


  const result =
    await db
      .from("products")
      .delete()
      .eq(
        "id",
        id
      );


  if (result.error) {

    showStatus(
      "Erro ao excluir: " +
      result.error.message,
      true
    );

    return;

  }


  showStatus(
    "Produto excluído."
  );


  loadProducts();

}


loadProducts();

</script>

</body>
</html>
