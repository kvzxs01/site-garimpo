<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel — Garimpo Online</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:820px;
  margin:auto;
  padding:30px 20px 70px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.top h1{
  margin:0;
}

.top a{
  color:#ffd600;
  text-decoration:none;
}

.box{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:20px;
  margin:18px 0;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin:14px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  background:#171717;
  color:#fff;
  border:1px solid #333;
  border-radius:9px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#ffd600;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:900;
  cursor:pointer;
  margin-top:12px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.primary{
  background:#ffd600;
  color:#000;
}

.secondary{
  background:#191919;
  color:#fff;
  border:1px solid #333;
}

.danger{
  background:#411515;
  color:#ffaaaa;
  border:1px solid #632020;
}

.edit{
  background:#202020;
  color:#ffd600;
  border:1px solid #444;
}

.cancel{
  background:#191919;
  color:#aaa;
  border:1px solid #333;
}

.upload{
  border:1px dashed #555;
  border-radius:10px;
  padding:18px;
  text-align:center;
  color:#999;
  margin-top:8px;
}

.upload input{
  border:0;
  padding:0;
  background:transparent;
}

.preview{
  display:none;
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  margin:12px auto 0;
}

.msg{
  font-size:12px;
  color:#999;
  margin-top:10px;
}

.error{
  color:#ff9b9b;
}

.success{
  color:#b7ffb7;
}

.hidden{
  display:none!important;
}

/* PRODUTOS */

.item{
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #292929;
  padding:14px 0;
}

.item:last-child{
  border-bottom:0;
}

.item img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:9px;
  background:#fff;
  flex-shrink:0;
}

.item-main{
  flex:1;
  min-width:0;
}

.item-main b{
  display:block;
  margin-bottom:5px;
  word-break:break-word;
}

.muted{
  font-size:11px;
  color:#777;
}

.item-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.item-actions .btn{
  margin-top:0;
  padding:9px 11px;
  font-size:11px;
}

/* EDITOR */

.editor{
  background:#0c0c0c;
  border:1px solid #333;
  border-radius:12px;
  padding:18px;
  margin-top:12px;
}

.editor h3{
  margin:0 0 15px;
  font-size:16px;
}

.editor-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.editor-actions .btn{
  margin-top:0;
}

.edit-preview{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:9px;
  background:#fff;
  display:block;
  margin-top:10px;
}

.status{
  display:inline-block;
  margin-top:6px;
  font-size:10px;
  font-weight:800;
}

.status.on{
  color:#8dff9d;
}

.status.off{
  color:#ff8d8d;
}

/* CELULAR */

@media(max-width:600px){

  .wrap{
    padding:20px 14px 50px;
  }

  .top{
    align-items:flex-start;
  }

  .top h1{
    font-size:24px;
  }

  .item{
    align-items:flex-start;
  }

  .item img{
    width:55px;
    height:55px;
  }

  .item-actions{
    flex-direction:column;
  }

  .item-actions .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <div class="top">
    <h1>Garimpo Online</h1>
    <a href="index.html">← Ver loja</a>
  </div>


  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginBox" class="box">

    <h2>Entrar no painel</h2>

    <p class="muted">
      Este login é somente para você administrar os produtos.
    </p>

    <label>E-mail</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
    >

    <label>Senha</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="btn primary"
    >
      Entrar
    </button>

    <div id="loginMsg" class="msg"></div>

  </section>


  <!-- =========================
       PAINEL
  ========================== -->

  <section id="panel" class="hidden">

    <div class="box">

      <button
        id="logoutBtn"
        class="btn secondary"
      >
        Sair
      </button>

      <h2>Adicionar produto</h2>

      <label>Nome</label>
      <input
        id="name"
        placeholder="Ex.: Fone Bluetooth"
      >

      <label>Preço</label>
      <input
        id="price"
        placeholder="R$ 79,90"
      >

      <label>Categoria</label>

      <select id="category">
        <option>Eletrônicos</option>
        <option>Casa</option>
        <option>Games</option>
        <option>Moda</option>
        <option>Beleza</option>
        <option>Automotivo</option>
        <option>Achadinhos</option>
      </select>

      <label>Imagem</label>

      <div class="upload">

        <input
          id="file"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <div>Escolha a imagem do produto</div>

        <img
          id="preview"
          class="preview"
        >

      </div>

      <label>Link de afiliado</label>

      <input
        id="affiliate"
        placeholder="https://..."
      >

      <label>Descrição</label>

      <textarea
        id="description"
        placeholder="Por que vale a pena?"
      ></textarea>

      <button
        id="addBtn"
        class="btn primary"
      >
        ＋ Publicar produto
      </button>

      <div id="msg" class="msg"></div>

    </div>


    <!-- =========================
         PRODUTOS
    ========================== -->

    <div class="box">

      <h2>Produtos publicados</h2>

      <div id="list"></div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

/* =========================
   SUPABASE
========================= */

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================
   UTILIDADES
========================= */

const $ = id =>
  document.getElementById(id);


const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );


let editingId = null;


/* =========================
   LOGIN / PAINEL
========================= */

function showPanel(){

  $("loginBox").classList.add("hidden");

  $("panel").classList.remove("hidden");

  loadProducts();

}


function showLogin(){

  $("panel").classList.add("hidden");

  $("loginBox").classList.remove("hidden");

}


async function init(){

  const r = await db.auth.getSession();

  if(r.error){

    $("loginMsg").textContent =
      r.error.message;

    $("loginMsg").className =
      "msg error";

    return;

  }

  if(r.data.session){

    showPanel();

  }else{

    showLogin();

  }

}


db.auth.onAuthStateChange(
  (event, session) => {

    if(session){

      showPanel();

    }else{

      showLogin();

    }

  }
);


/* =========================
   LOGIN
========================= */

$("loginBtn").onclick = async () => {

  const email =
    $("email").value.trim();

  const password =
    $("password").value;


  if(!email || !password){

    $("loginMsg").textContent =
      "Digite e-mail e senha.";

    $("loginMsg").className =
      "msg error";

    return;

  }


  $("loginBtn").disabled = true;

  $("loginMsg").textContent =
    "Entrando...";

  $("loginMsg").className =
    "msg";


  const r =
    await db.auth.signInWithPassword({
      email,
      password
    });


  $("loginBtn").disabled = false;


  if(r.error){

    $("loginMsg").textContent =
      r.error.message;

    $("loginMsg").className =
      "msg error";

    return;

  }


  $("loginMsg").textContent =
    "Login realizado!";

  $("loginMsg").className =
    "msg success";


  showPanel();

};


/* =========================
   LOGOUT
========================= */

$("logoutBtn").onclick = () =>
  db.auth.signOut();


/* =========================
   PREVIEW DA IMAGEM
========================= */

$("file").onchange = () => {

  const f =
    $("file").files[0];

  if(!f) return;


  if(f.size > 5 * 1024 * 1024){

    $("msg").textContent =
      "A imagem deve ter até 5 MB.";

    $("msg").className =
      "msg error";

    $("file").value = "";

    return;

  }


  $("preview").src =
    URL.createObjectURL(f);

  $("preview").style.display =
    "block";

};


/* =========================
   PUBLICAR PRODUTO
========================= */

$("addBtn").onclick = async () => {

  const f =
    $("file").files[0];

  const name =
    $("name").value.trim();

  const link =
    $("affiliate").value.trim();


  if(!name || !link || !f){

    $("msg").textContent =
      "Preencha nome, link e imagem.";

    $("msg").className =
      "msg error";

    return;

  }


  $("addBtn").disabled = true;

  $("msg").textContent =
    "Enviando imagem...";

  $("msg").className =
    "msg";


  const ext =
    (f.name.split(".").pop() || "jpg")
      .toLowerCase();


  const path =
    Date.now() +
    "-" +
    crypto.randomUUID() +
    "." +
    ext;


  const up =
    await db.storage
      .from("product-images")
      .upload(
        path,
        f,
        {
          contentType:f.type
        }
      );


  if(up.error){

    $("msg").textContent =
      "Erro no upload: " +
      up.error.message;

    $("msg").className =
      "msg error";

    $("addBtn").disabled = false;

    return;

  }


  const image_url =
    db.storage
      .from("product-images")
      .getPublicUrl(path)
      .data.publicUrl;


  const ins =
    await db.from("products").insert({

      name,

      price:
        $("price").value.trim(),

      category:
        $("category").value,

      image_url,

      affiliate_url:
        link,

      description:
        $("description").value.trim(),

      active:true

    });


  if(ins.error){

    $("msg").textContent =
      "Erro ao salvar: " +
      ins.error.message;

    $("msg").className =
      "msg error";

  }else{

    $("msg").textContent =
      "Produto publicado com sucesso!";

    $("msg").className =
      "msg success";


    limparFormulario();

    loadProducts();

  }


  $("addBtn").disabled = false;

};


/* =========================
   LIMPAR FORMULÁRIO
========================= */

function limparFormulario(){

  [
    "name",
    "price",
    "affiliate",
    "description"
  ].forEach(id => {

    $(id).value = "";

  });


  $("file").value = "";

  $("preview").style.display =
    "none";

}


/* =========================
   CARREGAR PRODUTOS
========================= */

async function loadProducts(){

  const r =
    await db
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(r.error){

    $("list").innerHTML =
      "<p class='msg error'>" +
      esc(r.error.message) +
      "</p>";

    return;

  }


  const products =
    r.data || [];


  if(!products.length){

    $("list").innerHTML =
      "<p class='muted'>" +
      "Nenhum produto ainda." +
      "</p>";

    return;

  }


  $("list").innerHTML =
    products.map(p => `

      <div class="item">

        <img
          src="${esc(p.image_url)}"
          alt="${esc(p.name)}"
        >

        <div class="item-main">

          <b>
            ${esc(p.name)}
          </b>

          <div class="muted">
            ${esc(p.price || "Sem preço")}
          </div>

          <div class="muted">
            ${esc(p.category || "Achadinhos")}
          </div>

          <span
            class="status ${p.active ? "on" : "off"}"
          >
            ${p.active ? "● Publicado" : "● Oculto"}
          </span>

        </div>

        <div class="item-actions">

          <button
            class="btn edit"
            onclick="editProduct('${p.id}')"
          >
            ✏️ Editar
          </button>

          <button
            class="btn danger"
            onclick="removeProduct('${p.id}')"
          >
            🗑️ Excluir
          </button>

        </div>

      </div>

      <div
        id="editor-${p.id}"
        class="editor hidden"
      ></div>

    `).join("");

}


/* =========================
   EDITAR PRODUTO
========================= */

window.editProduct = async id => {

  const r =
    await db
      .from("products")
      .select("*")
      .eq("id", id)
      .single();


  if(r.error){

    alert(
      "Erro ao carregar produto: " +
      r.error.message
    );

    return;

  }


  const p = r.data;

  const editor =
    $("editor-" + id);


  editor.classList.remove(
    "hidden"
  );


  editor.innerHTML = `

    <h3>✏️ Editar produto</h3>

    <label>Nome</label>

    <input
      id="edit-name-${id}"
      value="${esc(p.name)}"
    >


    <label>Preço</label>

    <input
      id="edit-price-${id}"
      value="${esc(p.price || "")}"
      placeholder="R$ 79,90"
    >


    <label>Categoria</label>

    <select id="edit-category-${id}">

      <option ${p.category === "Eletrônicos" ? "selected" : ""}>
        Eletrônicos
      </option>

      <option ${p.category === "Casa" ? "selected" : ""}>
        Casa
      </option>

      <option ${p.category === "Games" ? "selected" : ""}>
        Games
      </option>

      <option ${p.category === "Moda" ? "selected" : ""}>
        Moda
      </option>

      <option ${p.category === "Beleza" ? "selected" : ""}>
        Beleza
      </option>

      <option ${p.category === "Automotivo" ? "selected" : ""}>
        Automotivo
      </option>

      <option ${p.category === "Achadinhos" ? "selected" : ""}>
        Achadinhos
      </option>

    </select>


    <label>Link de afiliado</label>

    <input
      id="edit-affiliate-${id}"
      value="${esc(p.affiliate_url || "")}"
      placeholder="https://..."
    >


    <label>Descrição</label>

    <textarea
      id="edit-description-${id}"
    >${esc(p.description || "")}</textarea>


    <label>Trocar imagem (opcional)</label>

    <input
      id="edit-file-${id}"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >


    <img
      class="edit-preview"
      src="${esc(p.image_url || "")}"
      id="edit-preview-${id}"
    >


    <div class="editor-actions">

      <button
        class="btn primary"
        onclick="saveProduct('${id}')"
      >
        💾 Salvar alterações
      </button>

      <button
        class="btn cancel"
        onclick="cancelEdit('${id}')"
      >
        Cancelar
      </button>

    </div>

    <div
      id="edit-msg-${id}"
      class="msg"
    ></div>

  `;


  const fileInput =
    $("edit-file-" + id);


  fileInput.onchange = () => {

    const file =
      fileInput.files[0];

    if(!file) return;


    if(file.size > 5 * 1024 * 1024){

      $("edit-msg-" + id).textContent =
        "A imagem deve ter até 5 MB.";

      $("edit-msg-" + id).className =
        "msg error";

      fileInput.value = "";

      return;

    }


    $("edit-preview-" + id).src =
      URL.createObjectURL(file);

  };

};


/* =========================
   CANCELAR EDIÇÃO
========================= */

window.cancelEdit = id => {

  $("editor-" + id)
    .classList.add("hidden");

  $("editor-" + id)
    .innerHTML = "";

};


/* =========================
   SALVAR EDIÇÃO
========================= */

window.saveProduct = async id => {

  const msg =
    $("edit-msg-" + id);


  const name =
    $("edit-name-" + id)
      .value.trim();


  const price =
    $("edit-price-" + id)
      .value.trim();


  const category =
    $("edit-category-" + id)
      .value;


  const affiliate_url =
    $("edit-affiliate-" + id)
      .value.trim();


  const description =
    $("edit-description-" + id)
      .value.trim();


  if(!name){

    msg.textContent =
      "Digite o nome do produto.";

    msg.className =
      "msg error";

    return;

  }


  if(!affiliate_url){

    msg.textContent =
      "Digite o link de afiliado.";

    msg.className =
      "msg error";

    return;

  }


  msg.textContent =
    "Salvando...";

  msg.className =
    "msg";


  /* =========================
     BUSCAR PRODUTO ATUAL
  ========================== */

  const current =
    await db
      .from("products")
      .select("*")
      .eq("id", id)
      .single();


  if(current.error){

    msg.textContent =
      "Erro: " +
      current.error.message;

    msg.className =
      "msg error";

    return;

  }


  let image_url =
    current.data.image_url;


  /* =========================
     NOVA IMAGEM
  ========================== */

  const fileInput =
    $("edit-file-" + id);


  const file =
    fileInput.files[0];


  if(file){

    if(file.size > 5 * 1024 * 1024){

      msg.textContent =
        "A imagem deve ter até 5 MB.";

      msg.className =
        "msg error";

      return;

    }


    msg.textContent =
      "Enviando nova imagem...";


    const ext =
      (
        file.name
          .split(".")
          .pop() ||
        "jpg"
      ).toLowerCase();


    const path =
      Date.now() +
      "-" +
      crypto.randomUUID() +
      "." +
      ext;


    const upload =
      await db.storage
        .from("product-images")
        .upload(
          path,
          file,
          {
            contentType:file.type
          }
        );


    if(upload.error){

      msg.textContent =
        "Erro no upload: " +
        upload.error.message;

      msg.className =
        "msg error";

      return;

    }


    image_url =
      db.storage
        .from("product-images")
        .getPublicUrl(path)
        .data.publicUrl;

  }


  /* =========================
     ATUALIZAR BANCO
  ========================== */

  msg.textContent =
    "Atualizando produto...";


  const update =
    await db
      .from("products")
      .update({

        name,

        price,

        category,

        affiliate_url,

        description,

        image_url

      })
      .eq("id", id);


  if(update.error){

    msg.textContent =
      "Erro ao atualizar: " +
      update.error.message;

    msg.className =
      "msg error";

    return;

  }


  msg.textContent =
    "Produto atualizado com sucesso!";

  msg.className =
    "msg success";


  setTimeout(() => {

    loadProducts();

  }, 700);

};


/* =========================
   EXCLUIR PRODUTO
========================= */

window.removeProduct = async id => {

  if(
    !confirm(
      "Excluir este produto?"
    )
  ){
    return;
  }


  const r =
    await db
      .from("products")
      .delete()
      .eq("id", id);


  if(r.error){

    alert(
      "Erro ao excluir: " +
      r.error.message
    );

    return;

  }


  loadProducts();

};


/* =========================
   INICIAR
========================= */

init();

</script>

</body>
</html>
