<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gerenciar produtos | Garimpo Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px 80px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .top h1 {
      margin: 0;
      font-size: 28px;
    }

    .back {
      color: #ffd600;
      text-decoration: none;
      font-size: 13px;
    }

    .box {
      background: #111;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 25px;
    }

    .box h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      background: #080808;
      border: 1px solid #333;
      color: #fff;
      border-radius: 9px;
      padding: 12px;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #ffd600;
    }

    .full {
      grid-column: 1 / -1;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 18px;
      background: #ffd600;
      color: #000;
      font-weight: 900;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #ffe44d;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #222;
      color: #fff;
    }

    .secondary:hover {
      background: #333;
    }

    .danger {
      background: #d93025;
      color: #fff;
    }

    .danger:hover {
      background: #ef4035;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #191919;
      color: #aaa;
      font-size: 13px;
      display: none;
    }

    .products {
      display: grid;
      gap: 12px;
    }

    .product {
      border: 1px solid #292929;
      background: #0d0d0d;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .product-info {
      min-width: 0;
      flex: 1;
    }

    .product-name {
      font-weight: 800;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .product-price {
      color: #ffd600;
      font-weight: 900;
    }

    .product-ml {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .edit-title {
      color: #ffd600;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .product {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .top {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">
      <h1>Gerenciar produtos</h1>

      <a
        class="back"
        href="index.html"
      >
        ← Voltar para o site
      </a>
    </div>

    <!-- FORMULÁRIO -->
    <div class="box">

      <h2 id="formTitle">
        Adicionar produto
      </h2>

      <div class="grid">

        <div>
          <label for="name">
            Nome
          </label>

          <input
            id="name"
            type="text"
            placeholder="Ex.: Fone Bluetooth"
          >
        </div>

        <div>
          <label for="category">
            Categoria
          </label>

          <input
            id="category"
            type="text"
            placeholder="Ex.: Eletrônicos"
          >
        </div>

        <div class="full">
          <label for="description">
            Descrição
          </label>

          <textarea
            id="description"
            placeholder="Descrição do produto"
          ></textarea>
        </div>

        <div>
          <label for="price">
            Preço
          </label>

          <input
            id="price"
            type="number"
            step="0.01"
            placeholder="99.90"
          >
        </div>

        <div>
          <label for="mercadolivre_url">
            URL do Mercado Livre
          </label>

          <input
            id="mercadolivre_url"
            type="url"
            placeholder="https://www.mercadolivre.com.br/..."
          >
        </div>

        <div class="full">
          <label for="affiliate_url">
            Link de afiliado
          </label>

          <input
            id="affiliate_url"
            type="url"
            placeholder="Seu link de afiliado"
          >
        </div>

        <div class="full">
          <label for="image_url">
            URL da imagem
          </label>

          <input
            id="image_url"
            type="url"
            placeholder="https://..."
          >
        </div>

      </div>

      <div class="buttons">

        <button
          id="save"
          type="button"
        >
          Adicionar produto
        </button>

        <button
          id="cancelEdit"
          type="button"
          class="secondary"
          style="display:none;"
        >
          Cancelar edição
        </button>

      </div>

      <div
        id="status"
        class="status"
      ></div>

    </div>

    <!-- PRODUTOS -->
    <div class="box">

      <h2>
        Produtos cadastrados
      </h2>

      <div
        id="products"
        class="products"
      ></div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const status =
      document.getElementById("status");

    const saveButton =
      document.getElementById("save");

    const cancelEditButton =
      document.getElementById("cancelEdit");

    const formTitle =
      document.getElementById("formTitle");

    let editingId = null;

    function showStatus(message, error = false) {
      status.style.display = "block";
      status.textContent = message;
      status.style.color =
        error ? "#ff7777" : "#aaa";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        function(match) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[match];
        }
      );
    }

    function extractMLB(url) {
      if (!url) {
        return "";
      }

      const text =
        String(url).toUpperCase();

      const match =
        text.match(/MLB[-_]?(\d{6,})/);

      if (!match) {
        return "";
      }

      return "MLB" + match[1];
    }

    function getValue(id) {
      return document
        .getElementById(id)
        .value
        .trim();
    }

    function setValue(id, value) {
      document.getElementById(id).value =
        value ?? "";
    }

    function clearForm() {
      setValue("name", "");
      setValue("category", "");
      setValue("description", "");
      setValue("price", "");
      setValue("mercadolivre_url", "");
      setValue("affiliate_url", "");
      setValue("image_url");

      editingId = null;

      formTitle.textContent =
        "Adicionar produto";

      saveButton.textContent =
        "Adicionar produto";

      cancelEditButton.style.display =
        "none";
    }

    function startEdit(product) {
      editingId = product.id;

      setValue("name", product.name);
      setValue("category", product.category);
      setValue("description", product.description);

      const price =
        product.current_price ??
        product.price ??
        "";

      setValue("price", price);

      setValue(
        "mercadolivre_url",
        product.mercadolivre_url
      );

      setValue(
        "affiliate_url",
        product.affiliate_url
      );

      setValue(
        "image_url",
        product.image_url
      );

      formTitle.textContent =
        "Editar produto";

      saveButton.textContent =
        "Salvar alterações";

      cancelEditButton.style.display =
        "inline-block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    async function loadProducts() {
      const result = await db
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (result.error) {
        console.error(result.error);

        document.getElementById(
          "products"
        ).innerHTML = `
          <div class="empty">
            Erro ao carregar produtos.
          </div>
        `;

        return;
      }

      const products =
        result.data || [];

      if (!products.length) {
        document.getElementById(
          "products"
        ).innerHTML = `
          <div class="empty">
            Nenhum produto cadastrado.
          </div>
        `;

        return;
      }

      document.getElementById(
        "products"
      ).innerHTML =
        products.map(function(product) {

          const price =
            product.current_price ??
            product.price;

          let formattedPrice =
            "Consultar preço";

          if (
            price !== null &&
            price !== undefined &&
            price !== ""
          ) {
            const number =
              Number(price);

            if (Number.isFinite(number)) {
              formattedPrice =
                number.toLocaleString(
                  "pt-BR",
                  {
                    style: "currency",
                    currency: "BRL"
                  }
                );
            }
          }

          return `
            <div class="product">

              <div class="product-info">

                <div class="product-name">
                  ${escapeHtml(
                    product.name ||
                    "Produto"
                  )}
                </div>

                <div class="product-price">
                  ${escapeHtml(
                    formattedPrice
                  )}
                </div>

                <div class="product-ml">
                  ${
                    product.mercadolivre_id
                      ? escapeHtml(
                          product.mercadolivre_id
                        )
                      : "Sem ID do Mercado Livre"
                  }
                </div>

              </div>

              <div class="actions">

                <button
                  type="button"
                  class="secondary"
                  onclick="editProduct('${escapeHtml(product.id)}')"
                >
                  Editar
                </button>

                <button
                  type="button"
                  class="secondary"
                  onclick="updatePrice('${escapeHtml(product.id)}')"
                >
                  Atualizar preço
                </button>

                <button
                  type="button"
                  class="danger"
                  onclick="removeProduct('${escapeHtml(product.id)}')"
                >
                  Excluir
                </button>

              </div>

            </div>
          `;
        }).join("");
    }

    async function editProduct(id) {
      showStatus("Carregando produto...");

      const result = await db
        .from("products")
        .select("*")
        .eq("id", id)
        .single();

      if (result.error) {
        console.error(result.error);

        showStatus(
          "Erro ao carregar produto: " +
          result.error.message,
          true
        );

        return;
      }

      startEdit(result.data);

      status.style.display = "none";
    }

    saveButton.addEventListener(
      "click",
      async function() {

        const name =
          getValue("name");

        const category =
          getValue("category");

        const description =
          getValue("description");

        const price =
          getValue("price");

        const mlUrl =
          getValue("mercadolivre_url");

        const affiliateUrl =
          getValue("affiliate_url");

        const imageUrl =
          getValue("image_url");

        if (!name) {
          showStatus(
            "Digite o nome do produto.",
            true
          );
          return;
        }

        const mlId =
          extractMLB(mlUrl);

        if (!mlId) {
          showStatus(
            "Coloque uma URL válida do Mercado Livre contendo MLB + número.",
            true
          );
          return;
        }

        const numericPrice =
          price !== ""
            ? Number(price)
            : null;

        if (
          price !== "" &&
          !Number.isFinite(numericPrice)
        ) {
          showStatus(
            "Digite um preço válido.",
            true
          );
          return;
        }

        saveButton.disabled = true;

        if (editingId) {
          showStatus(
            "Salvando alterações..."
          );

          const result = await db
            .from("products")
            .update({
              name: name,
              description: description,
              price: numericPrice,
              current_price: numericPrice,
              image_url: imageUrl,
              affiliate_url: affiliateUrl,
              category:
                category || "Achadinhos",
              mercadolivre_id: mlId,
              mercadolivre_url: mlUrl
            })
            .eq("id", editingId);

          saveButton.disabled = false;

          if (result.error) {
            console.error(result.error);

            showStatus(
              "Erro ao salvar alterações: " +
              result.error.message,
              true
            );

            return;
          }

          showStatus(
            "Produto atualizado com sucesso!"
          );

          clearForm();
          await loadProducts();

          return;
        }

        showStatus(
          "Adicionando produto..."
        );

        const result = await db
          .from("products")
          .insert({
            name: name,
            description: description,
            price: numericPrice,
            current_price: numericPrice,
            image_url: imageUrl,
            affiliate_url: affiliateUrl,
            category:
              category || "Achadinhos",
            active: true,
            mercadolivre_id: mlId,
            mercadolivre_url: mlUrl
          });

        saveButton.disabled = false;

        if (result.error) {
          console.error(result.error);

          showStatus(
            "Erro ao salvar: " +
            result.error.message,
            true
          );

          return;
        }

        showStatus(
          "Produto adicionado com sucesso!"
        );

        clearForm();
        await loadProducts();
      }
    );

    cancelEditButton.addEventListener(
      "click",
      function() {
        clearForm();
        status.style.display = "none";
      }
    );

    async function updatePrice(id) {
      showStatus(
        "Atualizando preço..."
      );

      try {
        const result =
          await fetch(
            SUPABASE_URL +
            "/functions/v1/atualizar-precos",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                product_id: id
              })
            }
          );

        const data =
          await result.json();

        if (!result.ok) {
          showStatus(
            data.error ||
            "Erro ao atualizar preço.",
            true
          );

          return;
        }

        showStatus(
          "Preço atualizado com sucesso!"
        );

        await loadProducts();

      } catch (error) {
        console.error(error);

        showStatus(
          "Erro ao conectar com a função de atualização.",
          true
        );
      }
    }

    async function removeProduct(id) {
      if (
        !confirm(
          "Excluir este produto?"
        )
      ) {
        return;
      }

      showStatus(
        "Excluindo produto..."
      );

      const result = await db
        .from("products")
        .delete()
        .eq("id", id);

      if (result.error) {
        console.error(result.error);

        showStatus(
          "Erro ao excluir: " +
          result.error.message,
          true
        );

        return;
      }

      if (editingId === id) {
        clearForm();
      }

      showStatus(
        "Produto excluído."
      );

      await loadProducts();
    }

    loadProducts();
  </script>

</body>
</html>
