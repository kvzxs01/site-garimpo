<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Painel — Garimpo Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top a {
      color: #ffd600;
      text-decoration: none;
    }

    .box {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 20px;
      margin: 18px 0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin: 14px 0 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      background: #171717;
      color: #fff;
      border: 1px solid #333;
      border-radius: 9px;
    }

    textarea {
      min-height: 80px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 15px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 15px;
    }

    .primary {
      background: #ffd600;
      color: #000;
    }

    .secondary {
      background: #191919;
      color: #fff;
      border: 1px solid #333;
    }

    .danger {
      background: #411515;
      color: #ffaaaa;
    }

    .edit {
      background: #1c1c1c;
      color: #ffd600;
      border: 1px solid #444;
      margin-left: 6px;
    }

    .upload {
      border: 1px dashed #555;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      color: #999;
      margin-top: 8px;
    }

    .upload input {
      border: 0;
      padding: 0;
      background: transparent;
    }

    .preview {
      display: none;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      margin: 12px auto 0;
    }

    .msg {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
    }

    .error {
      color: #ff9b9b;
    }

    .success {
      color: #b7ffb7;
    }

    .hidden {
      display: none;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #292929;
      padding: 12px 0;
    }

    .item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      background: #fff;
    }

    .item-main {
      flex: 1;
    }

    .muted {
      font-size: 11px;
      color: #777;
    }

    .ml-id {
      color: #ffd600;
      font-size: 11px;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      align-items: center;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="top">
      <h1>Garimpo Online</h1>
      <a href="index.html">← Ver loja</a>
    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <section id="loginBox" class="box">

      <h2>Entrar no painel</h2>

      <p class="muted">
        Este login é somente para você administrar os produtos.
      </p>

      <label>E-mail</label>

      <input
        id="email"
        type="email"
        autocomplete="username"
      >

      <label>Senha</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        class="btn primary"
      >
        Entrar
      </button>

      <div
        id="loginMsg"
        class="msg"
      ></div>

    </section>


    <!-- =========================
         PAINEL
    ========================== -->

    <section
      id="panel"
      class="hidden"
    >

      <div class="box">

        <button
          id="logoutBtn"
          class="btn secondary"
        >
          Sair
        </button>

        <h2>Adicionar produto</h2>


        <label>Nome</label>

        <input
          id="name"
          placeholder="Ex.: Fone Bluetooth"
        >


        <!-- =========================
             ID AFILIADO
        ========================== -->

        <label>
          ID de afiliado do Mercado Livre
        </label>

        <input
          id="mercadolivre_id"
          placeholder="Ex.: R6PPBF-4F7N"
        >

        <div class="msg">
          Cole aqui o ID que aparece em
          <b>Copiar ID</b> na Central de Afiliados.
        </div>


        <!-- =========================
             CATEGORIA
        ========================== -->

        <label>Categoria</label>

        <select id="category">

          <option>Eletrônicos</option>
          <option>Casa</option>
          <option>Games</option>
          <option>Moda</option>
          <option>Beleza</option>
          <option>Automotivo</option>
          <option>Achadinhos</option>

        </select>


        <!-- =========================
             IMAGEM
        ========================== -->

        <label>Imagem</label>

        <div class="upload">

          <input
            id="file"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >

          <div>
            Escolha a imagem do produto
          </div>

          <img
            id="preview"
            class="preview"
          >

        </div>


        <!-- =========================
             LINK AFILIADO
        ========================== -->

        <label>Link de afiliado</label>

        <input
          id="affiliate"
          placeholder="https://meli.la/..."
        >


        <!-- =========================
             DESCRIÇÃO
        ========================== -->

        <label>Descrição</label>

        <textarea
          id="description"
          placeholder="Por que vale a pena?"
        ></textarea>


        <button
          id="addBtn"
          class="btn primary"
        >
          ＋ Publicar produto
        </button>

        <div
          id="msg"
          class="msg"
        ></div>

      </div>


      <!-- =========================
           PRODUTOS
      ========================== -->

      <div class="box">

        <h2>Produtos publicados</h2>

        <div id="list"></div>

      </div>

    </section>

  </main>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    const db =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const $ =
      id => document.getElementById(id);


    const esc =
      s =>
        String(s ?? "")
          .replace(
            /[&<>"']/g,
            m => ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;"
            }[m])
          );


    /* =========================
       MOSTRAR PAINEL
    ========================== */

    function showPanel() {

      $("loginBox")
        .classList
        .add("hidden");

      $("panel")
        .classList
        .remove("hidden");

      loadProducts();

    }


    function showLogin() {

      $("panel")
        .classList
        .add("hidden");

      $("loginBox")
        .classList
        .remove("hidden");

    }


    /* =========================
       LOGIN
    ========================== */

    async function init() {

      const r =
        await db.auth.getSession();

      if (r.error) {

        $("loginMsg").textContent =
          r.error.message;

        $("loginMsg").className =
          "msg error";

        return;
      }

      if (r.data.session) {

        showPanel();

      } else {

        showLogin();

      }


      db.auth.onAuthStateChange(
        (event, session) => {

          if (session) {

            showPanel();

          } else {

            showLogin();

          }

        }
      );

    }


    $("loginBtn").onclick =
      async () => {

        const email =
          $("email")
            .value
            .trim();

        const password =
          $("password")
            .value;


        if (!email || !password) {

          $("loginMsg").textContent =
            "Digite e-mail e senha.";

          $("loginMsg").className =
            "msg error";

          return;

        }


        $("loginBtn").disabled =
          true;

        $("loginMsg").textContent =
          "Entrando...";


        const r =
          await db.auth.signInWithPassword({
            email,
            password
          });


        $("loginBtn").disabled =
          false;


        if (r.error) {

          $("loginMsg").textContent =
            r.error.message;

          $("loginMsg").className =
            "msg error";

          return;

        }


        $("loginMsg").textContent =
          "Login realizado!";

        $("loginMsg").className =
          "msg success";


        showPanel();

      };


    /* =========================
       SAIR
    ========================== */

    $("logoutBtn").onclick =
      () => db.auth.signOut();


    /* =========================
       PREVIEW DA IMAGEM
    ========================== */

    $("file").onchange =
      () => {

        const f =
          $("file")
            .files[0];


        if (!f) return;


        if (
          f.size >
          5 * 1024 * 1024
        ) {

          $("msg").textContent =
            "A imagem deve ter até 5 MB.";

          $("msg").className =
            "msg error";

          $("file").value =
            "";

          return;

        }


        $("preview").src =
          URL.createObjectURL(f);

        $("preview").style.display =
          "block";

      };


    /* =========================
       ADICIONAR PRODUTO
    ========================== */

    $("addBtn").onclick =
      async () => {

        const f =
          $("file")
            .files[0];

        const name =
          $("name")
            .value
            .trim();

        const mercadolivre_id =
          $("mercadolivre_id")
            .value
            .trim();

        const link =
          $("affiliate")
            .value
            .trim();


        if (
          !name ||
          !mercadolivre_id ||
          !link ||
          !f
        ) {

          $("msg").textContent =
            "Preencha nome, ID de afiliado, link e imagem.";

          $("msg").className =
            "msg error";

          return;

        }


        $("addBtn").disabled =
          true;

        $("msg").textContent =
          "Enviando imagem...";


        /* =========================
           UPLOAD
        ========================== */

        const ext =
          (
            f.name
              .split(".")
              .pop() ||
            "jpg"
          )
            .toLowerCase();


        const path =
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          ext;


        const up =
          await db.storage
            .from("product-images")
            .upload(
              path,
              f,
              {
                contentType:
                  f.type
              }
            );


        if (up.error) {

          $("msg").textContent =
            "Erro no upload: " +
            up.error.message;

          $("msg").className =
            "msg error";

          $("addBtn").disabled =
            false;

          return;

        }


        const image_url =
          db.storage
            .from("product-images")
            .getPublicUrl(path)
            .data
            .publicUrl;


        /* =========================
           SALVAR PRODUTO
        ========================== */

        const ins =
          await db
            .from("products")
            .insert({

              name,

              mercadolivre_id,

              category:
                $("category").value,

              image_url,

              affiliate_url:
                link,

              description:
                $("description")
                  .value
                  .trim(),

              active:
                true

            });


        if (ins.error) {

          $("msg").textContent =
            "Erro ao salvar: " +
            ins.error.message;

          $("msg").className =
            "msg error";

        } else {

          $("msg").textContent =
            "Produto publicado com sucesso!";

          $("msg").className =
            "msg success";


          [
            "name",
            "mercadolivre_id",
            "affiliate",
            "description"
          ]
            .forEach(
              id =>
                $(id).value = ""
            );


          $("file").value =
            "";

          $("preview")
            .style
            .display =
            "none";


          loadProducts();

        }


        $("addBtn").disabled =
          false;

      };


    /* =========================
       CARREGAR PRODUTOS
    ========================== */

    async function loadProducts() {

      const r =
        await db
          .from("products")
          .select("*")
          .order(
            "created_at",
            {
              ascending:
                false
            }
          );


      if (r.error) {

        $("list").innerHTML =
          "<p class='msg error'>" +
          esc(r.error.message) +
          "</p>";

        return;

      }


      $("list").innerHTML =
        (
          r.data || []
        )
          .map(
            p => `

              <div class="item">

                <img
                  src="${esc(p.image_url)}"
                >

                <div class="item-main">

                  <b>
                    ${esc(p.name)}
                  </b>

                  <div class="ml-id">

                    ID afiliado:
                    ${esc(
                      p.mercadolivre_id ||
                      "não informado"
                    )}

                  </div>

                  <div class="muted">

                    ${
                      p.current_price
                        ? "Preço atual: R$ " +
                          Number(
                            p.current_price
                          ).toFixed(2)
                        : "Preço aguardando atualização"
                    }

                  </div>

                </div>

                <div class="actions">

                  <button
                    class="btn danger"
                    onclick="removeProduct('${p.id}')"
                  >
                    Excluir
                  </button>

                </div>

              </div>

            `
          )
          .join("")


        ||

        "<p class='muted'>" +
        "Nenhum produto ainda." +
        "</p>";

    }


    /* =========================
       EXCLUIR
    ========================== */

    window.removeProduct =
      async id => {

        if (
          !confirm(
            "Excluir este produto?"
          )
        ) {

          return;

        }


        const r =
          await db
            .from("products")
            .delete()
            .eq(
              "id",
              id
            );


        if (r.error) {

          alert(
            r.error.message
          );

        }


        loadProducts();

      };


    /* =========================
       INICIAR
    ========================== */

    init();

  </script>

</body>
</html>
