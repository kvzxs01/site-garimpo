<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garimpo Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header {
      height: 72px;
      border-bottom: 1px solid #292929;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      background: rgba(8, 8, 8, 0.94);
      backdrop-filter: blur(10px);

      z-index: 1000;

      transition: transform 0.3s ease;
    }

    header.hide {
      transform: translateY(-100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;

      border-radius: 10px;

      background: #ffd600;
      color: #000;

      display: grid;
      place-items: center;

      font-weight: 900;
      font-size: 22px;
    }

    .brand b {
      font-size: 14px;
    }

    .brand small {
      display: block;

      color: #888;

      font-size: 10px;

      margin-top: 3px;
    }

    /* =========================
       BOTÃO MERCADO LIVRE
    ========================= */

    .ml-connect {
      background: #ffd600;
      color: #000;

      border: 0;
      border-radius: 9px;

      padding: 10px 14px;

      font-size: 12px;
      font-weight: 900;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .ml-connect:hover {
      background: #ffe44d;
      transform: translateY(-1px);
    }

    .ml-connect:active {
      transform: translateY(0);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1100px;

      margin: auto;

      padding: 145px 20px 55px;
    }

    .yellow {
      color: #ffd600;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 74px);

      line-height: 0.98;

      letter-spacing: -3px;

      margin: 16px 0;
    }

    .hero p {
      max-width: 600px;

      color: #999;

      line-height: 1.6;

      margin-bottom: 0;
    }

    /* =========================
       CONTEÚDO
    ========================= */

    .wrap {
      max-width: 1100px;

      margin: auto;

      padding: 0 20px 80px;
    }

    /* =========================
       BUSCA
    ========================= */

    .bar {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 25px;
    }

    .search {
      flex: 1;

      min-width: 220px;

      background: #111;

      border: 1px solid #333;

      color: #fff;

      border-radius: 9px;

      padding: 13px 14px;

      font-size: 14px;

      transition: border-color 0.2s ease;
    }

    .search:focus {
      outline: none;

      border-color: #ffd600;
    }

    .search::placeholder {
      color: #777;
    }

    /* =========================
       CATEGORIAS
    ========================= */

    .cats {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;
    }

    .cat {
      background: #111;

      color: #bbb;

      border: 1px solid #333;

      border-radius: 9px;

      padding: 10px 12px;

      cursor: pointer;

      font-size: 12px;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .cat:hover {
      border-color: #555;

      color: #fff;
    }

    .cat.active {
      background: #ffd600;

      color: #000;

      border-color: #ffd600;

      font-weight: 800;
    }

    /* =========================
       GRID
    ========================= */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;

      align-items: stretch;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: #111;

      border: 1px solid #292929;

      border-radius: 15px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      height: 100%;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);

      border-color: #444;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.35);
    }

    /* =========================
       IMAGEM
    ========================= */

    .pic {
      aspect-ratio: 1 / 1;

      background: #fff;

      flex-shrink: 0;

      overflow: hidden;
    }

    .pic img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform 0.3s ease;
    }

    .card:hover .pic img {
      transform: scale(1.03);
    }

    /* =========================
       INFORMAÇÕES
    ========================= */

    .info {
      padding: 14px;

      display: flex;

      flex-direction: column;

      flex: 1;

      min-height: 215px;
    }

    .catname {
      font-size: 10px;

      color: #ffd600;

      font-weight: 900;

      text-transform: uppercase;

      margin-bottom: 6px;
    }

    .name {
      font-weight: 800;

      font-size: 14px;

      line-height: 1.35;

      margin: 0 0 7px;
    }

    .desc {
      color: #999;

      font-size: 12px;

      line-height: 1.4;

      margin: 0;

      display: -webkit-box;

      -webkit-box-orient: vertical;

      -webkit-line-clamp: 3;

      line-clamp: 3;

      overflow: hidden;

      min-height: 50px;
    }

    /* =========================
       PREÇO
    ========================= */

    .price {
      margin-top: auto;

      margin-bottom: 10px;

      color: #fff;

      font-size: 21px;

      font-weight: 900;

      line-height: 1.2;

      display: flex;

      align-items: baseline;

      gap: 4px;
    }

    /* =========================
       BOTÃO
    ========================= */

    .buy {
      display: block;

      width: 100%;

      text-align: center;

      background: #ffd600;

      color: #000;

      border-radius: 9px;

      padding: 12px;

      text-decoration: none;

      font-weight: 900;

      font-size: 12px;

      margin-top: 0;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .buy:hover {
      background: #ffe44d;

      transform: translateY(-1px);
    }

    .buy:active {
      transform: translateY(0);
    }

    /* =========================
       VAZIO
    ========================= */

    .empty {
      grid-column: 1 / -1;

      text-align: center;

      color: #777;

      padding: 50px 20px;
    }

    /* =========================
       RODAPÉ
    ========================= */

    footer {
      text-align: center;

      border-top: 1px solid #292929;

      padding: 30px;

      color: #777;

      font-size: 11px;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns:
          repeat(3, 1fr);
      }
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .hero {
        padding-top: 130px;
      }
    }

    @media (max-width: 500px) {
      header {
        height: 64px;

        padding: 0 15px;
      }

      .logo {
        width: 36px;
        height: 36px;

        font-size: 19px;
      }

      .brand b {
        font-size: 13px;
      }

      .brand small {
        font-size: 9px;
      }

      .ml-connect {
        padding: 9px 10px;

        font-size: 10px;
      }

      .hero {
        padding:
          115px 15px 40px;
      }

      .hero h1 {
        font-size: 43px;

        letter-spacing: -2px;
      }

      .wrap {
        padding:
          0 15px 60px;
      }

      .grid {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 9px;
      }

      .info {
        padding: 10px;

        min-height: 195px;
      }

      .catname {
        font-size: 8px;
      }

      .name {
        font-size: 12px;
      }

      .desc {
        font-size: 10px;

        min-height: 43px;
      }

      .price {
        font-size: 16px;

        margin-bottom: 8px;
      }

      .buy {
        padding: 10px 6px;

        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CABEÇALHO
  ========================= -->

  <header id="header">

    <div class="brand">

      <div class="logo">
        G
      </div>

      <div>
        <b>Garimpo Online</b>

        <small>
          Achadinhos que valem a pena
        </small>
      </div>

    </div>


    <!-- =========================
         CONECTAR MERCADO LIVRE
    ========================= -->

    <button
      id="mlConnectButton"
      class="ml-connect"
      type="button"
    >
      🛒 Conectar Mercado Livre
    </button>

  </header>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <div class="yellow">
      🔥 ACHADOS • OFERTAS • DESCONTOS
    </div>

    <h1>
      Produtos que
      <span class="yellow">
        valem o clique.
      </span>
    </h1>

    <p>
      Uma seleção de achadinhos de diferentes lojas
      e programas de afiliados.
    </p>

  </section>


  <!-- =========================
       PRODUTOS
  ========================= -->

  <main class="wrap">

    <div class="bar">

      <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Procurar produto..."
        autocomplete="off"
      >

      <div
        id="cats"
        class="cats"
      ></div>

    </div>


    <div
      id="grid"
      class="grid"
    ></div>

  </main>


  <!-- =========================
       RODAPÉ
  ========================= -->

  <footer>
    Garimpo Online · O melhor site para achadinhos.
  </footer>


  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <!-- =========================
       MERCADO LIVRE + SITE
  ========================= -->

  <script>

    /* =====================================================
       MERCADO LIVRE - CONFIGURAÇÃO
    ===================================================== */

    const ML_CLIENT_ID =
      "3125220410520940";

    const ML_REDIRECT_URI =
      "https://kvzxs01.github.io/site-garimpo/oauth/callback.html";


    /* =====================================================
       GERAR STRING ALEATÓRIA PARA PKCE
    ===================================================== */

    function gerarStringAleatoria(tamanho = 64) {

      const caracteres =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "0123456789-._~";

      const valores =
        new Uint8Array(tamanho);

      crypto.getRandomValues(valores);

      let resultado = "";

      for (const valor of valores) {

        resultado +=
          caracteres[
            valor % caracteres.length
          ];

      }

      return resultado;
    }


    /* =====================================================
       GERAR CODE CHALLENGE PKCE
    ===================================================== */

    async function gerarCodeChallenge(
      verifier
    ) {

      const encoder =
        new TextEncoder();

      const data =
        encoder.encode(verifier);

      const hash =
        await crypto.subtle.digest(
          "SHA-256",
          data
        );

      const bytes =
        new Uint8Array(hash);

      let binary = "";

      for (const byte of bytes) {

        binary +=
          String.fromCharCode(byte);

      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=/g, "");

    }


    /* =====================================================
       INICIAR CONEXÃO COM MERCADO LIVRE
    ===================================================== */

    async function conectarMercadoLivre() {

      try {

        /*
         * Gerar verifier.
         *
         * Esse valor NÃO vai para o Mercado Livre
         * diretamente nesta etapa.
         *
         * Ele será guardado no navegador e usado
         * depois quando o code voltar.
         */

        const codeVerifier =
          gerarStringAleatoria(64);


        /*
         * Gerar challenge a partir do verifier.
         */

        const codeChallenge =
          await gerarCodeChallenge(
            codeVerifier
          );


        /*
         * Gerar state de segurança.
         */

        const state =
          gerarStringAleatoria(32);


        /*
         * Guardar os dados temporariamente.
         */

        sessionStorage.setItem(
          "ml_code_verifier",
          codeVerifier
        );

        sessionStorage.setItem(
          "ml_oauth_state",
          state
        );


        /*
         * Montar URL de autorização.
         */

        const params =
          new URLSearchParams({

            response_type:
              "code",

            client_id:
              ML_CLIENT_ID,

            redirect_uri:
              ML_REDIRECT_URI,

            code_challenge:
              codeChallenge,

            code_challenge_method:
              "S256",

            state:
              state

          });


        const authorizationUrl =
          "https://auth.mercadolivre.com.br/authorization?" +
          params.toString();


        console.log(
          "Iniciando autorização do Mercado Livre..."
        );


        /*
         * Mandar usuário para o Mercado Livre.
         */

        window.location.href =
          authorizationUrl;

      }

      catch (error) {

        console.error(
          "Erro ao iniciar OAuth:",
          error
        );

        alert(
          "Não foi possível iniciar a conexão com o Mercado Livre."
        );

      }

    }


    /* =====================================================
       BOTÃO MERCADO LIVRE
    ===================================================== */

    const mlButton =
      document.getElementById(
        "mlConnectButton"
      );

    if (mlButton) {

      mlButton.addEventListener(
        "click",
        conectarMercadoLivre
      );

    }


    /* =====================================================
       VERIFICAR CONFIGURAÇÃO DO SUPABASE
    ===================================================== */

    const grid =
      document.getElementById(
        "grid"
      );


    if (
      typeof SUPABASE_URL === "undefined" ||
      typeof SUPABASE_ANON_KEY === "undefined"
    ) {

      console.error(
        "config.js não carregou SUPABASE_URL ou SUPABASE_ANON_KEY."
      );

      grid.innerHTML = `
        <div class="empty">
          Erro de configuração do Supabase.
        </div>
      `;

      throw new Error(
        "SUPABASE_URL ou SUPABASE_ANON_KEY não encontrados."
      );

    }


    /* =====================================================
       CONEXÃO SUPABASE
    ===================================================== */

    const db =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    let products = [];

    let selected = "Todos";


    /* =====================================================
       PROTEÇÃO HTML
    ===================================================== */

    function esc(value) {

      return String(
        value ?? ""
      ).replace(
        /[&<>"']/g,
        function (match) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[match];

        }
      );

    }


    /* =====================================================
       FORMATAR PREÇO
    ===================================================== */

    function formatPrice(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "Consultar preço";

      }


      const number =
        Number(value);


      if (
        Number.isFinite(number)
      ) {

        return number.toLocaleString(
          "pt-BR",
          {
            style: "currency",
            currency: "BRL"
          }
        );

      }


      const text =
        String(value).trim();


      if (
        /^r\$/i.test(text)
      ) {

        return text;

      }


      return `R$ ${text}`;

    }


    /* =====================================================
       CARREGAR PRODUTOS
    ===================================================== */

    async function load() {

      try {

        /*
         * Primeiro tenta somente produtos ativos.
         */

        let result =
          await db
            .from("products")
            .select("*")
            .eq(
              "active",
              true
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        /*
         * FALLBACK
         *
         * Caso a coluna active não exista
         * ou a consulta apresente erro,
         * busca sem o filtro.
         */

        if (result.error) {

          console.warn(
            "Consulta com active falhou. Tentando sem filtro active.",
            result.error
          );

          result =
            await db
              .from("products")
              .select("*")
              .order(
                "created_at",
                {
                  ascending: false
                }
              );

        }


        /* =================================================
           VERIFICAR ERRO
        ================================================= */

        if (result.error) {

          console.error(
            "Erro ao carregar produtos:",
            result.error
          );

          grid.innerHTML = `
            <div class="empty">
              Erro ao carregar produtos.
              <br><br>
              <small>
                Abra o Console do navegador
                (F12) para ver o erro do Supabase.
              </small>
            </div>
          `;

          return;

        }


        /* =================================================
           PRODUTOS RECEBIDOS
        ================================================= */

        products =
          result.data || [];


        console.log(
          "Produtos carregados:",
          products
        );


        renderCats();

        render();

      }

      catch (error) {

        console.error(
          "Erro inesperado:",
          error
        );

        grid.innerHTML = `
          <div class="empty">
            Erro ao carregar produtos.
          </div>
        `;

      }

    }


    /* =====================================================
       CATEGORIAS
    ===================================================== */

    function renderCats() {

      const categorias =
        products
          .map(
            function (product) {
              return product.category;
            }
          )
          .filter(Boolean);


      const cats = [
        "Todos",
        ...new Set(categorias)
      ];


      document
        .getElementById("cats")
        .innerHTML =
        cats
          .map(
            function (category) {

              return `
                <button
                  class="cat ${
                    category === selected
                      ? "active"
                      : ""
                  }"
                  data-cat="${esc(category)}"
                  type="button"
                >
                  ${esc(category)}
                </button>
              `;

            }
          )
          .join("");


      document
        .querySelectorAll(".cat")
        .forEach(
          function (button) {

            button.onclick =
              function () {

                selected =
                  button.dataset.cat;

                renderCats();

                render();

              };

          }
        );

    }


    /* =====================================================
       RENDERIZAR PRODUTOS
    ===================================================== */

    function render() {

      const search =
        document.getElementById(
          "search"
        );


      const q =
        search
          ? search.value
              .toLowerCase()
              .trim()
          : "";


      const list =
        products.filter(
          function (product) {

            const matchesCategory =
              selected === "Todos" ||
              product.category === selected;


            const text =
              `${product.name || ""} ${
                product.description || ""
              }`
                .toLowerCase();


            const matchesSearch =
              text.includes(q);


            return (
              matchesCategory &&
              matchesSearch
            );

          }
        );


      /* =================================================
         NENHUM PRODUTO
      ================================================= */

      if (!list.length) {

        grid.innerHTML = `
          <div class="empty">
            Nenhum produto encontrado.
          </div>
        `;

        return;

      }


      /* =================================================
         MONTAR CARDS
      ================================================= */

      grid.innerHTML =
        list
          .map(
            function (product) {

              /*
               * PREÇO
               *
               * Prioridade:
               *
               * 1. current_price
               * 2. price
               */

              const currentPrice =
                product.current_price !== null &&
                product.current_price !== undefined &&
                product.current_price !== ""
                  ? product.current_price
                  : product.price;


              const formattedPrice =
                formatPrice(
                  currentPrice
                );


              /*
               * LINK DE AFILIADO
               */

              const affiliateUrl =
                String(
                  product.affiliate_url ||
                  "#"
                ).trim();


              /*
               * IMAGEM
               */

              const imageUrl =
                String(
                  product.image_url ||
                  ""
                ).trim();


              return `
                <article class="card">

                  <div class="pic">

                    <img
                      src="${esc(imageUrl)}"
                      alt="${esc(
                        product.name ||
                        "Produto"
                      )}"
                      loading="lazy"
                    >

                  </div>


                  <div class="info">

                    <div class="catname">
                      ${esc(
                        product.category ||
                        "Achadinhos"
                      )}
                    </div>


                    <div class="name">
                      ${esc(
                        product.name ||
                        "Produto"
                      )}
                    </div>


                    <div class="desc">
                      ${esc(
                        product.description ||
                        "Confira a oferta."
                      )}
                    </div>


                    <div class="price">
                      ${esc(
                        formattedPrice
                      )}
                    </div>


                    <a
                      class="buy"
                      href="${esc(
                        affiliateUrl
                      )}"
                      target="_blank"
                      rel="nofollow sponsored noopener"
                    >
                      Ver oferta →
                    </a>

                  </div>

                </article>
              `;

            }
          )
          .join("");

    }


    /* =====================================================
       PESQUISA
    ===================================================== */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        render
      );


    /* =====================================================
       ESCONDER CABEÇALHO AO ROLAR
    ===================================================== */

    const header =
      document.getElementById(
        "header"
      );


    let lastScrollY = 0;


    window.addEventListener(
      "scroll",
      function () {

        const currentScrollY =
          window.scrollY;


        if (
          currentScrollY <= 10
        ) {

          header.classList.remove(
            "hide"
          );

          lastScrollY =
            currentScrollY;

          return;

        }


        if (
          currentScrollY >
          lastScrollY
        ) {

          header.classList.add(
            "hide"
          );

        }

        else if (
          currentScrollY <
          lastScrollY
        ) {

          header.classList.remove(
            "hide"
          );

        }


        lastScrollY =
          currentScrollY;

      },
      {
        passive: true
      }
    );


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    load();

  </script>

</body>
</html>
