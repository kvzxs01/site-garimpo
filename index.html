<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garimpo Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      transition: transform .25s ease;
    }

    header.hidden {
      transform: translateY(-100%);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap;
    }

    .search {
      flex: 1;
    }

    .search input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .search input:focus {
      border-color: #999;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 25px;
      padding-bottom: 5px;
    }

    .category {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .category.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #eee;
    }

    .product-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-name {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .price-area {
      margin-top: auto;
    }

    .original-price {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      min-height: 18px;
    }

    .price {
      font-size: 23px;
      font-weight: 800;
      margin: 3px 0 12px;
    }

    .buy-button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #222;
      color: white;
      padding: 12px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .buy-button:hover {
      opacity: .9;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #777;
      grid-column: 1 / -1;
    }

    /* =========================
       GERENCIAR
    ========================= */

    #manageSection {
      display: none;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px 50px;
    }

    .manage-box {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .manage-box h2 {
      margin-top: 0;
    }

    .manage-form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .manage-form input,
    .manage-form select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .manage-form .full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      grid-column: 1 / -1;
    }

    button {
      border: 0;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: #222;
      color: white;
    }

    .btn-secondary {
      background: #ddd;
      color: #222;
    }

    .manage-item {
      border-top: 1px solid #eee;
      padding: 15px 0;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .manage-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .manage-info {
      flex: 1;
      min-width: 0;
    }

    .manage-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .manage-info small {
      color: #777;
      word-break: break-all;
    }

    .manage-actions {
      display: flex;
      gap: 7px;
    }

    .btn-edit {
      background: #eee;
    }

    .btn-delete {
      background: #ffdddd;
      color: #a00;
    }

    #loginBox {
      display: none;
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    #loginBox input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .error {
      color: #b00020;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .manage-form {
        grid-template-columns: 1fr;
      }

      .manage-form .full,
      .form-actions {
        grid-column: auto;
      }

      .manage-item {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .manage-actions {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header id="header">
  <div class="header-inner">

    <div class="logo">
      Garimpo Online
    </div>

    <div class="search">
      <input
        type="text"
        id="searchInput"
        placeholder="Buscar produtos..."
      >
    </div>

  </div>
</header>


<main>

  <div class="categories">
    <button class="category active" data-category="todos">
      Todos
    </button>

    <button class="category" data-category="eletronicos">
      Eletrônicos
    </button>

    <button class="category" data-category="casa">
      Casa
    </button>

    <button class="category" data-category="moda">
      Moda
    </button>

    <button class="category" data-category="outros">
      Outros
    </button>
  </div>


  <div id="products" class="products">

    <div class="loading">
      Carregando produtos...
    </div>

  </div>

</main>


<section id="manageSection">

  <div class="manage-box">

    <h2>Gerenciar produtos</h2>

    <form id="productForm" class="manage-form">

      <input
        type="hidden"
        id="editId"
      >

      <input
        id="name"
        placeholder="Nome do produto"
        required
      >

      <input
        id="category"
        placeholder="Categoria"
        required
      >

      <input
        id="image"
        class="full"
        placeholder="URL da imagem"
        required
      >

      <input
        id="affiliateId"
        class="full"
        placeholder="ID de afiliado do Mercado Livre"
        required
      >

      <input
        id="affiliateLink"
        class="full"
        placeholder="Link de afiliado (ex: https://meli.la/...)"
        required
      >

      <div class="form-actions">

        <button
          type="submit"
          class="btn-primary"
        >
          Salvar produto
        </button>

        <button
          type="button"
          id="cancelEdit"
          class="btn-secondary"
          style="display:none"
        >
          Cancelar edição
        </button>

      </div>

      <div
        id="formMessage"
        class="full"
      ></div>

    </form>


    <div id="manageList"></div>

  </div>

</section>


<div id="loginBox">

  <h2>Área administrativa</h2>

  <input
    type="password"
    id="adminPassword"
    placeholder="Senha"
  >

  <button
    class="btn-primary"
    onclick="loginAdmin()"
  >
    Entrar
  </button>

  <div id="loginError" class="error"></div>

</div>


<footer>
  Garimpo Online
</footer>


<script type="module">

  import {
    createClient
  } from "https://esm.sh/@supabase/supabase-js@2";


  // ==================================================
  // SUPABASE
  // ==================================================

  const SUPABASE_URL =
    "https://xokyvzjeoivmggsmkjjs.supabase.co";

  const SUPABASE_ANON_KEY =
    "COLOQUE_AQUI_SUA_ANON_KEY";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==================================================
  // ELEMENTOS
  // ==================================================

  const productsContainer =
    document.getElementById("products");

  const searchInput =
    document.getElementById("searchInput");

  const productForm =
    document.getElementById("productForm");

  const manageList =
    document.getElementById("manageList");

  const manageSection =
    document.getElementById("manageSection");

  const formMessage =
    document.getElementById("formMessage");

  const cancelEdit =
    document.getElementById("cancelEdit");


  let products = [];

  let selectedCategory = "todos";


  // ==================================================
  // FORMATAR PREÇO
  // ==================================================

  function formatPrice(price) {

    if (
      price === null ||
      price === undefined ||
      price === ""
    ) {
      return "Preço indisponível";
    }

    return Number(price).toLocaleString(
      "pt-BR",
      {
        style: "currency",
        currency: "BRL"
      }
    );

  }


  // ==================================================
  // CARREGAR PRODUTOS
  // ==================================================

  async function loadProducts() {

    const {
      data,
      error
    } = await supabase
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      productsContainer.innerHTML = `
        <div class="empty">
          Erro ao carregar produtos.
        </div>
      `;

      return;
    }


    products = data || [];

    renderProducts();

    renderManageList();

  }


  // ==================================================
  // RENDERIZAR PRODUTOS
  // ==================================================

  function renderProducts() {

    const search =
      searchInput.value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(product => {

        const name =
          String(
            product.name || ""
          ).toLowerCase();

        const category =
          String(
            product.category || ""
          ).toLowerCase();


        const matchesSearch =
          !search ||
          name.includes(search) ||
          category.includes(search);


        const matchesCategory =
          selectedCategory === "todos" ||
          category === selectedCategory;


        return (
          matchesSearch &&
          matchesCategory
        );

      });


    if (!filtered.length) {

      productsContainer.innerHTML = `
        <div class="empty">
          Nenhum produto encontrado.
        </div>
      `;

      return;
    }


    productsContainer.innerHTML =
      filtered.map(product => {

        const original =
          product.original_price;


        const current =
          product.current_price;


        return `

          <article class="product">

            <img
              class="product-image"
              src="${escapeHtml(product.image_url || "")}"
              alt="${escapeHtml(product.name || "Produto")}"
              onerror="this.style.display='none'"
            >

            <div class="product-content">

              <div class="product-name">
                ${escapeHtml(product.name || "")}
              </div>

              <div class="price-area">

                <div class="original-price">
                  ${
                    original &&
                    Number(original) > Number(current)
                      ? formatPrice(original)
                      : ""
                  }
                </div>

                <div class="price">
                  ${formatPrice(current)}
                </div>

                <a
                  class="buy-button"
                  href="${escapeHtml(product.affiliate_link || "#")}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Ver oferta
                </a>

              </div>

            </div>

          </article>

        `;

      }).join("");

  }


  // ==================================================
  // ESCAPAR HTML
  // ==================================================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // ==================================================
  // BUSCA
  // ==================================================

  searchInput.addEventListener(
    "input",
    renderProducts
  );


  // ==================================================
  // CATEGORIAS
  // ==================================================

  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".category")
            .forEach(b =>
              b.classList.remove("active")
            );

          button.classList.add("active");

          selectedCategory =
            button.dataset.category;

          renderProducts();

        }
      );

    });


  // ==================================================
  // GERENCIAMENTO
  // ==================================================

  function renderManageList() {

    if (!manageSection ||
        manageSection.style.display !== "block") {
      return;
    }


    manageList.innerHTML =
      products.map(product => {

        return `

          <div class="manage-item">

            <img
              src="${escapeHtml(product.image_url || "")}"
              alt=""
            >

            <div class="manage-info">

              <strong>
                ${escapeHtml(product.name || "")}
              </strong>

              <small>
                ID afiliado:
                ${escapeHtml(product.ml_item_id || "não informado")}
              </small>

              <br>

              <small>
                ${formatPrice(product.current_price)}
              </small>

            </div>

            <div class="manage-actions">

              <button
                class="btn-edit"
                onclick="editProduct('${product.id}')"
              >
                Editar
              </button>

              <button
                class="btn-delete"
                onclick="deleteProduct('${product.id}')"
              >
                Excluir
              </button>

            </div>

          </div>

        `;

      }).join("");

  }


  // ==================================================
  // SALVAR / EDITAR
  // ==================================================

  productForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      formMessage.textContent =
        "Salvando...";


      const editId =
        document.getElementById("editId").value;


      const product = {

        name:
          document.getElementById("name").value.trim(),

        category:
          document.getElementById("category").value.trim().toLowerCase(),

        image_url:
          document.getElementById("image").value.trim(),

        ml_item_id:
          document.getElementById("affiliateId").value.trim(),

        affiliate_link:
          document.getElementById("affiliateLink").value.trim()

      };


      let result;


      if (editId) {

        result =
          await supabase
            .from("products")
            .update(product)
            .eq(
              "id",
              editId
            );

      } else {

        result =
          await supabase
            .from("products")
            .insert(product);

      }


      if (result.error) {

        console.error(result.error);

        formMessage.textContent =
          "Erro: " +
          result.error.message;

        return;

      }


      formMessage.textContent =
        "Produto salvo!";


      resetForm();

      await loadProducts();

    }
  );


  // ==================================================
  // EDITAR
  // ==================================================

  window.editProduct =
    function(id) {

      const product =
        products.find(
          p => p.id === id
        );


      if (!product) {
        return;
      }


      document.getElementById("editId").value =
        product.id;

      document.getElementById("name").value =
        product.name || "";

      document.getElementById("category").value =
        product.category || "";

      document.getElementById("image").value =
        product.image_url || "";

      document.getElementById("affiliateId").value =
        product.ml_item_id || "";

      document.getElementById("affiliateLink").value =
        product.affiliate_link || "";


      cancelEdit.style.display =
        "block";


      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    };


  // ==================================================
  // CANCELAR EDIÇÃO
  // ==================================================

  cancelEdit.addEventListener(
    "click",
    resetForm
  );


  function resetForm() {

    productForm.reset();

    document.getElementById("editId").value =
      "";

    cancelEdit.style.display =
      "none";

    formMessage.textContent =
      "";

  }


  // ==================================================
  // EXCLUIR
  // ==================================================

  window.deleteProduct =
    async function(id) {

      const confirmed =
        confirm(
          "Tem certeza que deseja excluir este produto?"
        );


      if (!confirmed) {
        return;
      }


      const {
        error
      } = await supabase
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


      if (error) {

        alert(
          "Erro ao excluir: " +
          error.message
        );

        return;
      }


      await loadProducts();

    };


  // ==================================================
  // ADMIN
  // ==================================================

  window.loginAdmin =
    function() {

      const password =
        document.getElementById("adminPassword").value;


      /*
        TROQUE ESTA SENHA.
        Depois podemos colocar autenticação
        verdadeira pelo Supabase.
      */

      const ADMIN_PASSWORD =
        "troque-esta-senha";


      if (
        password === ADMIN_PASSWORD
      ) {

        document.getElementById("loginBox")
          .style.display = "none";

        manageSection.style.display =
          "block";

        renderManageList();

      } else {

        document.getElementById("loginError")
          .textContent =
            "Senha incorreta.";

      }

    };


  // ==================================================
  // ATALHO PARA ABRIR ADMIN
  // ==================================================

  /*
    Para abrir:

    seu-site.com/#gerenciar

    ou pelo console:

    openAdmin()
  */

  window.openAdmin =
    function() {

      document.getElementById("loginBox")
        .style.display = "block";

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    };


  // ==================================================
  // HEADER ESCONDENDO AO ROLAR
  // ==================================================

  let lastScroll =
    window.scrollY;


  window.addEventListener(
    "scroll",
    () => {

      const current =
        window.scrollY;


      if (current > lastScroll &&
          current > 100) {

        document
          .getElementById("header")
          .classList.add("hidden");

      } else {

        document
          .getElementById("header")
          .classList.remove("hidden");

      }


      lastScroll =
        current;

    }
  );


  // ==================================================
  // INICIALIZAÇÃO
  // ==================================================

  loadProducts();

</script>

</body>
</html>
