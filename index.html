<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garimpo Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 72px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      padding: 0 6%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(8, 8, 8, 0.94);
      backdrop-filter: blur(10px);
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    header.hide {
      transform: translateY(-100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #ffd600;
      color: #000;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 22px;
    }

    .brand b {
      font-size: 14px;
    }

    .brand small {
      display: block;
      color: #888;
      font-size: 10px;
      margin-top: 3px;
    }

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 145px 20px 55px;
    }

    .yellow {
      color: #ffd600;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 74px);
      line-height: 0.98;
      letter-spacing: -3px;
      margin: 16px 0;
    }

    .hero p {
      max-width: 600px;
      color: #999;
      line-height: 1.6;
      margin: 0;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px 80px;
    }

    .bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .search {
      flex: 1;
      min-width: 220px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 9px;
      padding: 13px 14px;
      font-size: 14px;
    }

    .search:focus {
      outline: none;
      border-color: #ffd600;
    }

    .search::placeholder {
      color: #777;
    }

    .cats {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .cat {
      background: #111;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 9px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 12px;
    }

    .cat:hover {
      border-color: #555;
      color: #fff;
    }

    .cat.active {
      background: #ffd600;
      color: #000;
      border-color: #ffd600;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      align-items: stretch;
    }

    .card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #444;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .pic {
      aspect-ratio: 1 / 1;
      background: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .card:hover .pic img {
      transform: scale(1.03);
    }

    .info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 215px;
    }

    .catname {
      font-size: 10px;
      color: #ffd600;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .name {
      font-weight: 800;
      font-size: 14px;
      line-height: 1.35;
      margin: 0 0 7px;
    }

    .desc {
      color: #999;
      font-size: 12px;
      line-height: 1.4;
      margin: 0;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
      min-height: 50px;
    }

    .price {
      margin-top: auto;
      margin-bottom: 10px;
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
    }

    .buy {
      display: block;
      width: 100%;
      text-align: center;
      background: #ffd600;
      color: #000;
      border-radius: 9px;
      padding: 12px;
      text-decoration: none;
      font-weight: 900;
      font-size: 12px;
    }

    .buy:hover {
      background: #ffe44d;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      padding: 50px 20px;
    }

    footer {
      text-align: center;
      border-top: 1px solid #292929;
      padding: 30px;
      color: #777;
      font-size: 11px;
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero {
        padding-top: 130px;
      }
    }

    @media (max-width: 500px) {
      header {
        height: 64px;
        padding: 0 15px;
      }

      .logo {
        width: 36px;
        height: 36px;
        font-size: 19px;
      }

      .brand b {
        font-size: 13px;
      }

      .brand small {
        font-size: 9px;
      }

      .hero {
        padding: 115px 15px 40px;
      }

      .hero h1 {
        font-size: 43px;
        letter-spacing: -2px;
      }

      .wrap {
        padding: 0 15px 60px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }

      .info {
        padding: 10px;
        min-height: 195px;
      }

      .catname {
        font-size: 8px;
      }

      .name {
        font-size: 12px;
      }

      .desc {
        font-size: 10px;
        min-height: 43px;
      }

      .price {
        font-size: 16px;
        margin-bottom: 8px;
      }

      .buy {
        padding: 10px 6px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <header id="header">

    <div class="brand">

      <div class="logo">
        G
      </div>

      <div>
        <b>Garimpo Online</b>

        <small>
          Achadinhos que valem a pena
        </small>
      </div>

    </div>

  </header>

  <section class="hero">

    <div class="yellow">
      🔥 ACHADOS • OFERTAS • DESCONTOS
    </div>

    <h1>
      Produtos que
      <span class="yellow">
        valem o clique.
      </span>
    </h1>

    <p>
      Uma seleção de achadinhos de diferentes lojas
      e programas de afiliados.
    </p>

  </section>

  <main class="wrap">

    <div class="bar">

      <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Procurar produto..."
        autocomplete="off"
      >

      <div
        id="cats"
        class="cats"
      ></div>

    </div>

    <div
      id="grid"
      class="grid"
    ></div>

  </main>

  <footer>
    Garimpo Online · Links de afiliados podem gerar comissão.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    let products = [];
    let selected = "Todos";

    function esc(value) {
      return String(value ?? "")
        .replace(/[&<>"']/g, function(match) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[match];
        });
    }

    function formatPrice(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "Consultar preço";
      }

      const number = Number(value);

      if (Number.isFinite(number)) {
        return number.toLocaleString(
          "pt-BR",
          {
            style: "currency",
            currency: "BRL"
          }
        );
      }

      return String(value);
    }

    async function load() {
      const result = await db
        .from("products")
        .select("*")
        .eq("active", true)
        .order("created_at", {
          ascending: false
        });

      if (result.error) {
        console.error(result.error);

        document.getElementById("grid").innerHTML = `
          <div class="empty">
            Erro ao carregar produtos.
          </div>
        `;

        return;
      }

      products = result.data || [];

      renderCats();
      render();
    }

    function renderCats() {
      const categories = products
        .map(product => product.category)
        .filter(Boolean);

      const cats = [
        "Todos",
        ...new Set(categories)
      ];

      document.getElementById("cats").innerHTML =
        cats.map(category => `
          <button
            class="cat ${category === selected ? "active" : ""}"
            data-cat="${esc(category)}"
            type="button"
          >
            ${esc(category)}
          </button>
        `).join("");

      document
        .querySelectorAll(".cat")
        .forEach(button => {
          button.onclick = function() {
            selected = button.dataset.cat;
            renderCats();
            render();
          };
        });
    }

    function render() {
      const q = document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

      const list = products.filter(product => {

        const categoryOK =
          selected === "Todos" ||
          product.category === selected;

        const text = `
          ${product.name || ""}
          ${product.description || ""}
        `.toLowerCase();

        return (
          categoryOK &&
          text.includes(q)
        );
      });

      const grid =
        document.getElementById("grid");

      if (!list.length) {
        grid.innerHTML = `
          <div class="empty">
            Nenhum produto encontrado.
          </div>
        `;

        return;
      }

      grid.innerHTML = list
        .map(product => {

          const currentPrice =
            product.current_price !== null &&
            product.current_price !== undefined &&
            String(product.current_price).trim() !== ""
              ? product.current_price
              : product.price;

          return `
            <article class="card">

              <div class="pic">
                <img
                  src="${esc(product.image_url || "")}"
                  alt="${esc(product.name || "Produto")}"
                  loading="lazy"
                >
              </div>

              <div class="info">

                <div class="catname">
                  ${esc(
                    product.category ||
                    "Achadinhos"
                  )}
                </div>

                <div class="name">
                  ${esc(
                    product.name ||
                    "Produto"
                  )}
                </div>

                <div class="desc">
                  ${esc(
                    product.description ||
                    "Confira a oferta."
                  )}
                </div>

                <div class="price">
                  ${esc(
                    formatPrice(currentPrice)
                  )}
                </div>

                <a
                  class="buy"
                  href="${esc(
                    product.affiliate_url ||
                    product.mercadolivre_url ||
                    "#"
                  )}"
                  target="_blank"
                  rel="nofollow sponsored noopener"
                >
                  Ver oferta →
                </a>

              </div>

            </article>
          `;
        })
        .join("");
    }

    document
      .getElementById("search")
      .addEventListener(
        "input",
        render
      );

    const header =
      document.getElementById("header");

    let lastScrollY = 0;

    window.addEventListener(
      "scroll",
      function() {

        const current =
          window.scrollY;

        if (current <= 10) {
          header.classList.remove("hide");
          lastScrollY = current;
          return;
        }

        if (current > lastScrollY) {
          header.classList.add("hide");
        } else if (current < lastScrollY) {
          header.classList.remove("hide");
        }

        lastScrollY = current;

      },
      {
        passive: true
      }
    );

    load();
  </script>

</body>
</html>
