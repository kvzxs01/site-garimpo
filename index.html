<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garimpo Online</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{
    height:72px;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:#080808ee;
    backdrop-filter:blur(10px);
    z-index:1000;
    transition:transform .3s ease;
}
.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:10px;background:#ffd600;color:#000;display:grid;place-items:center;font-weight:900;font-size:22px}
.brand small{display:block;color:#888;font-size:10px;margin-top:3px}.admin{color:#bbb;border:1px solid #333;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:12px}
.hero{max-width:1100px;margin:auto;padding:75px 20px 55px}.yellow{color:#ffd600}.hero h1{font-size:clamp(42px,7vw,74px);line-height:.98;letter-spacing:-3px;margin:16px 0}.hero p{max-width:600px;color:#999;line-height:1.6}
.wrap{max-width:1100px;margin:auto;padding:0 20px 80px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.search{flex:1;min-width:220px;background:#111;border:1px solid #333;color:#fff;border-radius:9px;padding:13px}.cats{display:flex;gap:7px;flex-wrap:wrap}.cat{background:#111;color:#bbb;border:1px solid #333;border-radius:9px;padding:10px 12px;cursor:pointer}.cat.active{background:#ffd600;color:#000;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#111;border:1px solid #292929;border-radius:15px;overflow:hidden}.pic{aspect-ratio:1;background:#fff}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.catname{font-size:10px;color:#ffd600;font-weight:900;text-transform:uppercase}.name{font-weight:800;font-size:14px;line-height:1.35;margin:7px 0}.desc{color:#999;font-size:12px;line-height:1.4;min-height:32px}.price{font-size:20px;font-weight:900;margin:12px 0}.buy{display:block;text-align:center;background:#ffd600;color:#000;border-radius:9px;padding:11px;text-decoration:none;font-weight:900;font-size:12px}.empty{grid-column:1/-1;text-align:center;color:#777;padding:50px}
footer{text-align:center;border-top:1px solid #292929;padding:30px;color:#777;font-size:11px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{gap:9px}.info{padding:10px}.name{font-size:12px}.price{font-size:17px}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="logo">G</div><div><b>Garimpo Online</b><small>Achadinhos que valem a pena</small></div></div>
<!-- Gerenciar escondido dos visitantes -->
<a class="admin" href="admin.html" style="display:none;">⚙ Gerenciar</a>
</header>
<section class="hero">
<div class="yellow">🔥 ACHADOS • OFERTAS • DESCONTOS</div>
<h1>Produtos que <span class="yellow">valem o clique.</span></h1>
<p>Uma seleção de achadinhos de diferentes lojas e programas de afiliados.</p>
</section>
<main class="wrap">
<div class="bar"><input id="search" class="search" placeholder="🔎 Procurar produto..."><div id="cats" class="cats"></div></div>
<div id="grid" class="grid"></div>
</main>
<footer>Garimpo Online · Links de afiliados podem gerar comissão.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let products=[],selected="Todos";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){
 const r=await db.from("products").select("*").eq("active",true).order("created_at",{ascending:false});
 if(r.error){document.getElementById("grid").innerHTML="<div class='empty'>Erro ao carregar produtos.</div>";return}
 products=r.data||[];renderCats();render();
}
function renderCats(){
 const cats=["Todos",...new Set(products.map(p=>p.category).filter(Boolean))];
 document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat ${c===selected?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
 document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{selected=b.dataset.cat;renderCats();render()});
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>(selected==="Todos"||p.category===selected)&&(`${p.name} ${p.description||""}`).toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.length?list.map(p=>`
 <article class="card"><div class="pic"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy"></div>
 <div class="info"><div class="catname">${esc(p.category||"Achadinhos")}</div><div class="name">${esc(p.name)}</div>
 <div class="desc">${esc(p.description||"Confira a oferta.")}</div><div class="price">${esc(p.price||"Ver oferta")}</div>
 <a class="buy" href="${esc(p.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener">Ver oferta →</a></div></article>`).join(""):"<div class='empty'>Nenhum produto encontrado.</div>";
}
document.getElementById("search").oninput=render;load();
</script>
</body>
</html>
