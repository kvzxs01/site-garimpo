<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Garimpo Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header {
      height: 72px;
      border-bottom: 1px solid #292929;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      background: rgba(8, 8, 8, 0.94);
      backdrop-filter: blur(10px);

      z-index: 1000;

      transition: transform 0.3s ease;
    }

    header.hide {
      transform: translateY(-100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;

      border-radius: 10px;

      background: #ffd600;
      color: #000;

      display: grid;
      place-items: center;

      font-weight: 900;
      font-size: 22px;
    }

    .brand b {
      font-size: 14px;
    }

    .brand small {
      display: block;

      color: #888;

      font-size: 10px;

      margin-top: 3px;
    }

    /* Gerenciar fica escondido para visitantes */

    .admin {
      display: none;

      color: #bbb;

      border: 1px solid #333;

      padding: 9px 12px;

      border-radius: 9px;

      text-decoration: none;

      font-size: 12px;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1100px;

      margin: auto;

      padding: 145px 20px 55px;
    }

    .yellow {
      color: #ffd600;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 74px);

      line-height: 0.98;

      letter-spacing: -3px;

      margin: 16px 0;
    }

    .hero p {
      max-width: 600px;

      color: #999;

      line-height: 1.6;

      margin-bottom: 0;
    }


    /* =========================
       CONTEÚDO
    ========================= */

    .wrap {
      max-width: 1100px;

      margin: auto;

      padding: 0 20px 80px;
    }


    /* =========================
       BUSCA
    ========================= */

    .bar {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 25px;
    }

    .search {
      flex: 1;

      min-width: 220px;

      background: #111;

      border: 1px solid #333;

      color: #fff;

      border-radius: 9px;

      padding: 13px 14px;

      font-size: 14px;

      transition: border-color 0.2s ease;
    }

    .search:focus {
      outline: none;

      border-color: #ffd600;
    }

    .search::placeholder {
      color: #777;
    }


    /* =========================
       CATEGORIAS
    ========================= */

    .cats {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;
    }

    .cat {
      background: #111;

      color: #bbb;

      border: 1px solid #333;

      border-radius: 9px;

      padding: 10px 12px;

      cursor: pointer;

      font-size: 12px;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .cat:hover {
      border-color: #555;

      color: #fff;
    }

    .cat.active {
      background: #ffd600;

      color: #000;

      border-color: #ffd600;

      font-weight: 800;
    }


    /* =========================
       GRID
    ========================= */

    .grid {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 15px;

      align-items: stretch;
    }


    /* =========================
       CARD
    ========================= */

    .card {
      background: #111;

      border: 1px solid #292929;

      border-radius: 15px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      height: 100%;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);

      border-color: #444;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }


    /* =========================
       IMAGEM
    ========================= */

    .pic {
      aspect-ratio: 1 / 1;

      background: #fff;

      flex-shrink: 0;

      overflow: hidden;
    }

    .pic img {
      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      transition: transform 0.3s ease;
    }

    .card:hover .pic img {
      transform: scale(1.03);
    }


    /* =========================
       INFORMAÇÕES
    ========================= */

    .info {
      padding: 14px;

      display: flex;

      flex-direction: column;

      flex: 1;

      min-height: 215px;
    }

    .catname {
      font-size: 10px;

      color: #ffd600;

      font-weight: 900;

      text-transform: uppercase;

      margin-bottom: 6px;
    }

    .name {
      font-weight: 800;

      font-size: 14px;

      line-height: 1.35;

      margin: 0 0 7px;
    }

    .desc {
      color: #999;

      font-size: 12px;

      line-height: 1.4;

      margin: 0;

      /*
        Limita a descrição a 3 linhas.
      */

       display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
      min-height: 50px;
    }


    /* =========================
       PREÇO
    ========================= */

    .price {
      margin-top: auto;

      margin-bottom: 10px;

      color: #fff;

      font-size: 21px;

      font-weight: 900;

      line-height: 1.2;

      display: flex;

      align-items: baseline;

      gap: 4px;
    }

    .price-label {
      font-size: 12px;

      color: #999;

      font-weight: 600;
    }


    /* =========================
       BOTÃO
    ========================= */

    .buy {
      display: block;

      width: 100%;

      text-align: center;

      background: #ffd600;

      color: #000;

      border-radius: 9px;

      padding: 12px;

      text-decoration: none;

      font-weight: 900;

      font-size: 12px;

      margin-top: 0;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .buy:hover {
      background: #ffe44d;

      transform: translateY(-1px);
    }

    .buy:active {
      transform: translateY(0);
    }


    /* =========================
       VAZIO
    ========================= */

    .empty {
      grid-column: 1 / -1;

      text-align: center;

      color: #777;

      padding: 50px 20px;
    }


    /* =========================
       RODAPÉ
    ========================= */

    footer {
      text-align: center;

      border-top: 1px solid #292929;

      padding: 30px;

      color: #777;

      font-size: 11px;
    }


    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1000px) {

      .grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }


    @media (max-width: 850px) {

      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero {
        padding-top: 130px;
      }

    }


    @media (max-width: 500px) {

      header {
        height: 64px;

        padding: 0 15px;
      }

      .logo {
        width: 36px;

        height: 36px;

        font-size: 19px;
      }

      .brand b {
        font-size: 13px;
      }

      .brand small {
        font-size: 9px;
      }

      .hero {
        padding: 115px 15px 40px;
      }

      .hero h1 {
        font-size: 43px;

        letter-spacing: -2px;
      }

      .wrap {
        padding: 0 15px 60px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 9px;
      }

      .info {
        padding: 10px;

        min-height: 195px;
      }

      .catname {
        font-size: 8px;
      }

      .name {
        font-size: 12px;
      }

      .desc {
        font-size: 10px;

        min-height: 43px;
      }

      .price {
        font-size: 16px;

        margin-bottom: 8px;
      }

      .buy {
        padding: 10px 6px;

        font-size: 10px;
      }

    }
  </style>
</head>


<body>


  <!-- =========================
       CABEÇALHO
  ========================= -->

  <header id="header">

    <div class="brand">

      <div class="logo">
        G
      </div>

      <div>
        <b>Garimpo Online</b>

        <small>
          Achadinhos que valem a pena
        </small>
      </div>

    </div>


    <!--
      Escondido para visitantes.
      O painel continua acessível em:

      /admin.html
    -->

    <a
      class="admin"
      href="admin.html"
    >
      ⚙ Gerenciar
    </a>

  </header>



  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <div class="yellow">
      🔥 ACHADOS • OFERTAS • DESCONTOS
    </div>

    <h1>
      Produtos que
      <span class="yellow">
        valem o clique.
      </span>
    </h1>

    <p>
      Uma seleção de achadinhos de diferentes lojas
      e programas de afiliados.
    </p>

  </section>



  <!-- =========================
       PRODUTOS
  ========================= -->

  <main class="wrap">

    <div class="bar">

      <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Procurar produto..."
      >

      <div
        id="cats"
        class="cats"
      ></div>

    </div>


    <div
      id="grid"
      class="grid"
    ></div>

  </main>



  <!-- =========================
       RODAPÉ
  ========================= -->

  <footer>
    Garimpo Online · O melhor site para achadinhos.
  </footer>



  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>


  <script>

    /* =========================
       CONEXÃO SUPABASE
    ========================= */

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    let products = [];

    let selected = "Todos";


    /* =========================
       PROTEÇÃO HTML
    ========================= */

    const esc = (s) => {

      return String(s ?? "").replace(
        /[&<>"']/g,

        (m) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[m])
      );

    };


    /* =========================
       CARREGAR PRODUTOS
    ========================= */

    async function load() {

      const r = await db
        .from("products")
        .select("*")
        .eq("active", true)
        .order("created_at", {
          ascending: false
        });


      if (r.error) {

        console.error(
          "Erro ao carregar produtos:",
          r.error
        );

        document.getElementById("grid").innerHTML = `
          <div class="empty">
            Erro ao carregar produtos.
          </div>
        `;

        return;
      }


      products = r.data || [];


      renderCats();

      render();

    }



    /* =========================
       CATEGORIAS
    ========================= */

    function renderCats() {

      const cats = [
        "Todos",
        ...new Set(
          products
            .map(
              (p) => p.category
            )
            .filter(Boolean)
        )
      ];


      document.getElementById("cats").innerHTML =
        cats
          .map(
            (c) => `
              <button
                class="cat ${c === selected ? "active" : ""}"
                data-cat="${esc(c)}"
              >
                ${esc(c)}
              </button>
            `
          )
          .join("");


      document
        .querySelectorAll(".cat")
        .forEach((button) => {

          button.onclick = () => {

            selected =
              button.dataset.cat;

            renderCats();

            render();

          };

        });

    }



    /* =========================
       RENDERIZAR PRODUTOS
    ========================= */

    function render() {

      const q =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const list =
        products.filter(
          (p) => {

            const matchesCategory =
              selected === "Todos" ||
              p.category === selected;


            const text =
              `${p.name || ""} ${p.description || ""}`
                .toLowerCase();


            const matchesSearch =
              text.includes(q);


            return (
              matchesCategory &&
              matchesSearch
            );

          }
        );


      if (!list.length) {

        document.getElementById("grid").innerHTML = `
          <div class="empty">
            Nenhum produto encontrado.
          </div>
        `;

        return;
      }


      document.getElementById("grid").innerHTML =

        list
          .map(
            (p) => {

              /*
                Aceita valores como:
                39,90
                39.90
                R$ 39,90

                Se você já cadastrar "R$ 39,90",
                não adiciona R$ novamente.
              */

              const rawPrice =
                String(
                  p.price ?? ""
                ).trim();


              const formattedPrice =
                rawPrice
                  ? (
                      /^r\$/i.test(rawPrice)
                        ? rawPrice
                        : `R$ ${rawPrice}`
                    )
                  : "Consultar preço";


              return `

                <article class="card">


                  <!-- IMAGEM -->

                  <div class="pic">

                    <img
                      src="${esc(p.image_url)}"
                      alt="${esc(p.name)}"
                      loading="lazy"
                    >

                  </div>


                  <!-- INFORMAÇÕES -->

                  <div class="info">


                    <div class="catname">
                      ${esc(
                        p.category ||
                        "Achadinhos"
                      )}
                    </div>


                    <div class="name">
                      ${esc(
                        p.name ||
                        "Produto"
                      )}
                    </div>


                    <div class="desc">
                      ${esc(
                        p.description ||
                        "Confira a oferta."
                      )}
                    </div>


                    <!--
                      O preço fica embaixo
                      graças ao margin-top:auto.
                    -->

                    <div class="price">
                      ${esc(
                        formattedPrice
                      )}
                    </div>


                    <!--
                      O botão fica sempre
                      logo abaixo do preço.
                    -->

                    <a
                      class="buy"
                      href="${esc(
                        p.affiliate_url ||
                        "#"
                      )}"
                      target="_blank"
                      rel="nofollow sponsored noopener"
                    >
                      Ver oferta →
                    </a>


                  </div>

                </article>

              `;

            }
          )
          .join("");

    }



    /* =========================
       PESQUISA
    ========================= */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        render
      );



    /* =========================
       ESCONDER CABEÇALHO AO DESCER
    ========================= */

    const header =
      document.getElementById(
        "header"
      );


    let lastScrollY = 0;


    window.addEventListener(
      "scroll",
      () => {

        const currentScrollY =
          window.scrollY;


        /*
          No topo:
          mostra o cabeçalho.
        */

        if (
          currentScrollY <= 10
        ) {

          header.classList.remove(
            "hide"
          );

          lastScrollY =
            currentScrollY;

          return;

        }


        /*
          Descendo:
          esconde.
        */

        if (
          currentScrollY >
          lastScrollY
        ) {

          header.classList.add(
            "hide"
          );

        }


        /*
          Subindo:
          mostra novamente.
        */

        else if (
          currentScrollY <
          lastScrollY
        ) {

          header.classList.remove(
            "hide"
          );

        }


        lastScrollY =
          currentScrollY;

      },
      {
        passive: true
      }
    );



    /* =========================
       INICIAR
    ========================= */

    load();

  </script>


</body>

</html>
