<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando ao Mercado Livre...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(90%, 420px);
      padding: 30px;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 22px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    .erro {
      color: #d00;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1 id="titulo">Conectando...</h1>
    <p id="mensagem">
      Aguarde enquanto finalizamos a conexão com o Mercado Livre.
    </p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://xokyvzjeoivmggsmkjjs.supabase.co";

    const EDGE_FUNCTION =
      SUPABASE_URL + "/functions/v1/mercadolivre-auth";

    async function conectar() {

      const params = new URLSearchParams(window.location.search);

      const code = params.get("code");
      const error = params.get("error");

      if (error) {
        document.getElementById("titulo").textContent =
          "Erro na autorização";

        document.getElementById("mensagem").textContent =
          params.get("error_description") || error;

        return;
      }

      if (!code) {
        document.getElementById("titulo").textContent =
          "Nenhum código recebido";

        document.getElementById("mensagem").textContent =
          "O Mercado Livre não enviou um código de autorização.";

        return;
      }

      document.getElementById("titulo").textContent =
        "Código recebido";

      document.getElementById("mensagem").textContent =
        "Finalizando conexão...";

      try {

        const response = await fetch(EDGE_FUNCTION, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            code: code,

            redirect_uri:
              "https://kvzxs01.github.io/site-garimpo/oauth/callback.html"
          })
        });

        const data = await response.json();

        console.log(
          "Status da Edge Function:",
          response.status
        );

        console.log(
          "Resposta da Edge Function:",
          data
        );

        if (!response.ok || !data.success) {
          throw new Error(
            data.error ||
            "Erro ao conectar com o Mercado Livre."
          );
        }

        document.getElementById("titulo").textContent =
          "Conectado com sucesso!";

        document.getElementById("mensagem").textContent =
          "Sua conta do Mercado Livre foi conectada.";

      } catch (err) {

        console.error(err);

        document.getElementById("titulo").textContent =
          "Erro ao conectar";

        document.getElementById("mensagem").textContent =
          err.message;

        document.getElementById("mensagem")
          .classList.add("erro");
      }
    }

    conectar();
  </script>

</body>
</html>
