<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando Mercado Livre...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      color: #ffd600;
    }

    p {
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Conectando...</h1>
    <p id="status">Finalizando conexão com o Mercado Livre.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const error = params.get("error");

    const status = document.getElementById("status");

    if (error) {
      status.textContent =
        "A autorização foi recusada: " + error;
    } else if (code) {
      status.textContent =
        "Código recebido. Finalizando conexão...";
      
      // Próxima etapa:
      // enviar esse código para a Edge Function
      console.log("Authorization code recebido:", code);
    } else {
      status.textContent =
        "Nenhum código de autorização foi recebido.";
    }
  </script>

</body>
</html>
