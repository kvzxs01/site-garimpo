<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conectando Mercado Livre</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 35px 25px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 26px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
      word-break: break-word;
    }

    .loading {
      margin: 25px auto;
      width: 42px;
      height: 42px;
      border: 4px solid #333;
      border-top-color: #ffd600;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .error {
      color: #ff6b6b;
      background: #241111;
      border: 1px solid #542020;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      color: #7cff9b;
      background: #102016;
      border: 1px solid #214b2b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="icon" id="icon">🔄</div>

    <h1 id="title">Conectando...</h1>

    <p id="message">
      Aguardando resposta do Mercado Livre.
    </p>

    <div class="loading" id="loading"></div>

    <div id="result"></div>

  </div>


  <!--
    O callback está dentro de /oauth/
    Por isso usamos ../config.js
  -->
  <script src="../config.js"></script>


  <script>

    /*
    ============================================================
    CONFIGURAÇÃO
    ============================================================
    */

    const EDGE_FUNCTION_URL =
      "https://xokyvzjeoivmggsmkjjs.supabase.co/functions/v1/mercadolivre-oauth";


    const REDIRECT_URI =
      "https://kvzxs01.github.io/site-garimpo/oauth/callback.html";


    /*
    ============================================================
    ELEMENTOS
    ============================================================
    */

    const icon =
      document.getElementById("icon");

    const title =
      document.getElementById("title");

    const message =
      document.getElementById("message");

    const loading =
      document.getElementById("loading");

    const result =
      document.getElementById("result");


    /*
    ============================================================
    ESCAPAR HTML
    ============================================================
    */

    function escapeHtml(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,
        function (char) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[char];

        }
      );

    }


    /*
    ============================================================
    ERRO
    ============================================================
    */

    function showError(text) {

      icon.textContent = "❌";

      title.textContent =
        "Erro na conexão";

      message.textContent =
        "Não foi possível finalizar a conexão com o Mercado Livre.";

      loading.style.display = "none";

      result.innerHTML = `
        <div class="error">
          ${escapeHtml(text)}
        </div>
      `;

    }


    /*
    ============================================================
    SUCESSO
    ============================================================
    */

    function showSuccess(text) {

      icon.textContent = "✅";

      title.textContent =
        "Conectado!";

      message.textContent =
        "Sua conta do Mercado Livre foi conectada com sucesso.";

      loading.style.display = "none";

      result.innerHTML = `
        <div class="success">
          ${escapeHtml(text)}
        </div>
      `;

    }


    /*
    ============================================================
    CONECTAR
    ============================================================
    */

    async function conectarMercadoLivre() {

      try {

        /*
        --------------------------------------------------------
        PEGAR A CHAVE DO CONFIG.JS
        --------------------------------------------------------
        */

        const supabaseAnonKey =
          window.SUPABASE_ANON_KEY;


        /*
        --------------------------------------------------------
        VERIFICAR CHAVE
        --------------------------------------------------------
        */

        if (!supabaseAnonKey) {

          throw new Error(
            "SUPABASE_ANON_KEY não foi encontrada no config.js."
          );

        }


        /*
        --------------------------------------------------------
        PEGAR PARÂMETROS DO MERCADO LIVRE
        --------------------------------------------------------
        */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const code =
          params.get("code");


        const error =
          params.get("error");


        const errorDescription =
          params.get("error_description");


        /*
        --------------------------------------------------------
        VERIFICAR ERRO DO MERCADO LIVRE
        --------------------------------------------------------
        */

        if (error) {

          throw new Error(
            "O Mercado Livre recusou a autorização.\n\n" +
            "Erro: " +
            error +
            "\n\n" +
            "Detalhes: " +
            (
              errorDescription ||
              "não informado"
            )
          );

        }


        /*
        --------------------------------------------------------
        VERIFICAR CODE
        --------------------------------------------------------
        */

        if (!code) {

          throw new Error(
            "Nenhum código de autorização foi recebido do Mercado Livre."
          );

        }


        /*
        --------------------------------------------------------
        STATUS
        --------------------------------------------------------
        */

        message.textContent =
          "Código recebido. Enviando para finalizar a conexão...";


        console.log(
          "Código recebido do Mercado Livre."
        );


        /*
        --------------------------------------------------------
        CHAMAR EDGE FUNCTION
        --------------------------------------------------------
        */

        const response =
          await fetch(
            EDGE_FUNCTION_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " +
                  supabaseAnonKey

              },

              body: JSON.stringify({

                code:
                  code,

                redirect_uri:
                  REDIRECT_URI

              })

            }
          );


        /*
        --------------------------------------------------------
        LER RESPOSTA
        --------------------------------------------------------
        */

        const responseText =
          await response.text();


        let data;


        try {

          data =
            responseText
              ? JSON.parse(responseText)
              : {};

        } catch {

          data = {
            raw: responseText
          };

        }


        console.log(
          "Resposta da Edge Function:",
          data
        );


        /*
        --------------------------------------------------------
        VERIFICAR HTTP
        --------------------------------------------------------
        */

        if (!response.ok) {

          let errorMessage =
            "A Edge Function retornou HTTP " +
            response.status;


          if (data.error) {

            errorMessage +=
              "\n\nErro: " +
              data.error;

          }


          if (data.message) {

            errorMessage +=
              "\n\nMensagem: " +
              data.message;

          }


          if (data.details) {

            errorMessage +=
              "\n\nDetalhes: " +
              data.details;

          }


          if (data.raw) {

            errorMessage +=
              "\n\nResposta:\n" +
              data.raw;

          }


          throw new Error(
            errorMessage
          );

        }


        /*
        --------------------------------------------------------
        SUCESSO
        --------------------------------------------------------
        */

        showSuccess(
          data.message ||
          "A autorização foi concluída com sucesso."
        );


        /*
        --------------------------------------------------------
        REMOVER CODE DA URL
        --------------------------------------------------------
        */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      }

      catch (error) {

        console.error(
          "Erro OAuth Mercado Livre:",
          error
        );


        showError(
          error.message ||
          "Erro desconhecido."
        );

      }

    }


    /*
    ============================================================
    INICIAR
    ============================================================
    */

    conectarMercadoLivre();

  </script>

</body>

</html>
